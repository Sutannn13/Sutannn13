<svg xmlns="http://www.w3.org/2000/svg" width="580" height="286" viewBox="0 0 580 286" role="img" aria-label="Solar System AR: interactive browser learning combining product UI and WebAR with A-Frame and AR.js.">
  <style>
    @keyframes spinA { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes spinB { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
    @keyframes sunPulse { 0%, 100% { opacity: 0.22; } 50% { opacity: 0.42; } }
    .orb1 { animation: spinA 6.4s linear infinite; }
    .orb2 { animation: spinA 11s linear infinite; }
    .orb3 { animation: spinB 16s linear infinite; }
    .halo { animation: sunPulse 4.6s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .orb1, .orb2, .orb3, .halo { animation: none !important; }
    }
  </style>
  <rect x="0.75" y="0.75" width="578.5" height="284.5" rx="10" fill="#14171c" stroke="#2c323c" stroke-width="1.5"/>
  <g stroke="#5b6575" stroke-width="1.15" opacity="0.65" fill="none"><path d="M16,26 L16,16 L26,16"/><path d="M554,16 L564,16 L564,26"/><path d="M16,260 L16,270 L26,270"/><path d="M554,270 L564,270 L564,260"/></g>

  <text x="32" y="42" font-family="'Cascadia Mono', Consolas, ui-monospace, monospace" font-size="12.5" fill="#969187">IMMERSIVE WEB AR</text>
  <text x="32" y="88" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#f3efe6">Solar System AR</text>
  <rect x="32" y="102" width="38" height="2.5" fill="#e57a52"/>

  <text x="32" y="138" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="16" fill="#b6b1a6">Interactive browser learning</text>
  <text x="32" y="162" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="16" fill="#b6b1a6">experience uniting product UI</text>
  <text x="32" y="186" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="16" fill="#b6b1a6">with 3D augmented reality.</text>

  <g font-family="'Cascadia Mono', Consolas, ui-monospace, monospace" font-size="12.5" fill="#f3efe6">
    <rect x="32" y="204" width="100" height="26" rx="4" fill="#1c2028" stroke="#2c323c"/>
    <text x="82" y="221" text-anchor="middle">TypeScript</text>
    <rect x="142" y="204" width="132" height="26" rx="4" fill="#1c2028" stroke="#2c323c"/>
    <text x="208" y="221" text-anchor="middle">A-Frame / AR.js</text>
  </g>
  <text x="34" y="256" font-family="'Cascadia Mono', Consolas, ui-monospace, monospace" font-size="12" font-weight="700" fill="#e57a52">VIEW REPOSITORY</text>

  <defs>
    <radialGradient id="sunGrad" cx="35%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#e6b877"/>
      <stop offset="55%" stop-color="#e57a52"/>
      <stop offset="100%" stop-color="#9c4727"/>
    </radialGradient>
  </defs>

  <!-- Subtle AR viewfinder reticle framing the 3D orrery -->
  <g stroke="#5b6575" stroke-width="1.1" opacity="0.55" fill="none">
    <path d="M356,74 L356,62 L368,62"/>
    <path d="M540,62 L552,62 L552,74"/>
    <path d="M356,226 L356,238 L368,238"/>
    <path d="M540,238 L552,238 L552,226"/>
  </g>

  <ellipse cx="454" cy="230" rx="76" ry="17" fill="#090b0e" opacity="0.35"/>

  <g transform="translate(454,146) rotate(-18) scale(1, 0.44)">
    <circle cx="0" cy="0" r="98" fill="none" stroke="#5b6575" stroke-width="1.6" stroke-dasharray="6 6"/>
    <g class="orb3">
      <circle cx="98" cy="0" r="9.5" fill="#d9a45b"/>
      <circle cx="95" cy="-3" r="3" fill="#e6b877"/>
    </g>
  </g>

  <g transform="translate(454,146) rotate(12) scale(1, 0.46)">
    <circle cx="0" cy="0" r="70" fill="none" stroke="#5b6575" stroke-width="1.5"/>
    <g class="orb2">
      <circle cx="-70" cy="0" r="11" fill="#e57a52"/>
      <circle cx="-73" cy="-3" r="3.5" fill="#f0936f"/>
    </g>
  </g>

  <circle cx="454" cy="146" r="30" fill="#e57a52" class="halo"/>
  <circle cx="454" cy="146" r="22" fill="url(#sunGrad)"/>

  <g transform="translate(454,146) rotate(-8) scale(1, 0.42)">
    <circle cx="0" cy="0" r="45" fill="none" stroke="#e57a52" stroke-width="1.4" opacity="0.85"/>
    <g class="orb1"><circle cx="45" cy="0" r="7.5" fill="#f3efe6"/></g>
  </g>
</svg>
