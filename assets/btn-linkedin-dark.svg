<svg xmlns="http://www.w3.org/2000/svg" width="260" height="76" viewBox="0 0 260 76" role="img" aria-label="LinkedIn: Profile">
  <style>
    @keyframes sweep {
      0%, 74% { transform: translateX(-290px); opacity: 0; }
      84% { opacity: 0.4; }
      94% { opacity: 0.4; }
      100% { transform: translateX(290px); opacity: 0; }
    }
    @keyframes glyphBob { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-2.5px); } }
    .sheen { animation: sweep 7.2s cubic-bezier(0.32, 0.72, 0, 1) 1.60s infinite; }
    .gbob { animation: glyphBob 4.6s cubic-bezier(0.32, 0.72, 0, 1) 1.60s infinite; }
    @media (prefers-reduced-motion: reduce) { .sheen, .gbob { animation: none !important; } }
  </style>
  <defs>
    <filter id="sblur" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="5.5"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
    </filter>
    <linearGradient id="sl-t" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#3b4556"/><stop offset="100%" stop-color="#262d3a"/></linearGradient>
    <linearGradient id="sl-l" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#262d3a"/><stop offset="100%" stop-color="#171c25"/></linearGradient>
    <linearGradient id="sl-r" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#171c25"/><stop offset="100%" stop-color="#06080c"/></linearGradient>

    <linearGradient id="ac-t" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f7a889"/><stop offset="100%" stop-color="#d96c43"/></linearGradient>
    <linearGradient id="ac-l" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#d96c43"/><stop offset="100%" stop-color="#8c3b1e"/></linearGradient>
    <linearGradient id="ac-r" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#8c3b1e"/><stop offset="100%" stop-color="#06080c"/></linearGradient>

    <linearGradient id="br-t" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f0cb8d"/><stop offset="100%" stop-color="#c48d44"/></linearGradient>
    <linearGradient id="br-l" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#c48d44"/><stop offset="100%" stop-color="#7c5522"/></linearGradient>
    <linearGradient id="br-r" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7c5522"/><stop offset="100%" stop-color="#06080c"/></linearGradient>

    <radialGradient id="spot-warm" cx="78%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#e57a52" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#e57a52" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spot-brass" cx="76%" cy="50%" r="46%">
      <stop offset="0%" stop-color="#d9a45b" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#d9a45b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spot-mini" cx="82%" cy="36%" r="36%">
      <stop offset="0%" stop-color="#e57a52" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#e57a52" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <defs>
    <clipPath id="tc"><rect x="1" y="1" width="258" height="74" rx="12"/></clipPath>
    <linearGradient id="sg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d9a45b" stop-opacity="0"/>
      <stop offset="50%" stop-color="#d9a45b" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#d9a45b" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0.75" y="0.75" width="258.5" height="74.5" rx="12" fill="#151920" stroke="#2b323f" stroke-width="1.15"/><line x1="16" y1="1.6" x2="244" y2="1.6" stroke="#ffffff" stroke-opacity="0.13" stroke-width="1"/>
  <g clip-path="url(#tc)"><rect x="0" y="0" width="96" height="76" fill="url(#sg)" class="sheen"/></g>
  <g class="gbob"><polygon points="22.0,39.0 31.0,43.2 31.0,56.2 22.0,52.0" fill="url(#sl-l)"/><polygon points="40.0,39.0 31.0,43.2 31.0,56.2 40.0,52.0" fill="url(#sl-r)"/><polygon points="31.0,34.8 40.0,39.0 31.0,43.2 22.0,39.0" fill="url(#sl-t)"/><polyline points="22.0,39.0 31.0,43.2 40.0,39.0" fill="none" stroke="#fff4e6" stroke-opacity="0.28" stroke-width="1.15" stroke-linejoin="round"/><polygon points="35.0,35.0 44.0,39.2 44.0,52.2 35.0,48.0" fill="url(#ac-l)"/><polygon points="53.0,35.0 44.0,39.2 44.0,52.2 53.0,48.0" fill="url(#ac-r)"/><polygon points="44.0,30.8 53.0,35.0 44.0,39.2 35.0,35.0" fill="url(#ac-t)"/><polyline points="35.0,35.0 44.0,39.2 53.0,35.0" fill="none" stroke="#fff4e6" stroke-opacity="0.28" stroke-width="1.15" stroke-linejoin="round"/></g>
  <text x="68" y="36" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="17" font-weight="700" letter-spacing="-0.2" fill="#f3efe6">LinkedIn</text>
  <text x="68" y="56" font-family="'Cascadia Mono', Consolas, ui-monospace, monospace" font-size="12" fill="#969187">Profile</text>
  <circle cx="228.0" cy="38.0" r="14.0" fill="#1e232d" stroke="#2b323f" stroke-width="1"/><path d="M225.4,33.8 L230.8,38.0 L225.4,42.2" fill="none" stroke="#d9a45b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
