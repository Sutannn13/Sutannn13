  <text x="600" y="66" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" letter-spacing="-0.4" fill="#161614">Observe the problem · Design the flow · Ship the system</text>
  <text x="600" y="100" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="16" fill="#4a4741">Open to junior backend or full-stack roles, internships, and focused product builds.</text>
