<svg xmlns="http://www.w3.org/2000/svg" width="260" height="74" viewBox="0 0 260 74" role="img" aria-label="Repositories: 22 public">
  <style>
    @keyframes sweep {
      0%, 72% { transform: translateX(-290px); opacity: 0; }
      82% { opacity: 0.45; }
      94% { opacity: 0.45; }
      100% { transform: translateX(290px); opacity: 0; }
    }
    @keyframes glyphBob {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-2.5px); }
    }
    .sheen { animation: sweep 6.4s ease-in-out 0.80s infinite; }
    .gbob { animation: glyphBob 4.2s ease-in-out 0.80s infinite; }
    @media (prefers-reduced-motion: reduce) {
      .sheen, .gbob { animation: none !important; }
    }
  </style>
  <defs>
    <clipPath id="tc"><rect x="1" y="1" width="258" height="72" rx="8"/></clipPath>
    <linearGradient id="sg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7d5318" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7d5318" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#7d5318" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0.75" y="0.75" width="258.5" height="72.5" rx="8" fill="#f7f4ee" stroke="#d6cfc2" stroke-width="1.5"/>
  <g clip-path="url(#tc)">
    <rect x="0" y="0" width="96" height="74" fill="url(#sg)" class="sheen"/>
  </g>
  <rect x="18" y="13" width="24" height="2.5" fill="#7d5318"/>
  <g class="gbob"><polygon points="24.5,48.5 37.0,54.3 37.0,60.8 24.5,55.0" fill="#d9d2c4" stroke="#d6cfc2" stroke-width="0.9" stroke-linejoin="round"/><polygon points="49.5,48.5 37.0,54.3 37.0,60.8 49.5,55.0" fill="#c7bfb0" stroke="#d6cfc2" stroke-width="0.9" stroke-linejoin="round"/><polygon points="37.0,42.7 49.5,48.5 37.0,54.3 24.5,48.5" fill="#e7e1d5" stroke="#d6cfc2" stroke-width="0.9" stroke-linejoin="round"/><polygon points="24.5,37.5 37.0,43.3 37.0,49.8 24.5,44.0" fill="#7d5318" stroke="#d6cfc2" stroke-width="0.9" stroke-linejoin="round"/><polygon points="49.5,37.5 37.0,43.3 37.0,49.8 49.5,44.0" fill="#5c3c0e" stroke="#d6cfc2" stroke-width="0.9" stroke-linejoin="round"/><polygon points="37.0,31.7 49.5,37.5 37.0,43.3 24.5,37.5" fill="#9c6d28" stroke="#d6cfc2" stroke-width="0.9" stroke-linejoin="round"/></g>
