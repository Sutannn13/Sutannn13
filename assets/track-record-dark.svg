  <text x="742" y="70" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="700" letter-spacing="-0.3" fill="#f3efe6">Registered HKI Copyright Inventor</text>
  <text x="742" y="98" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="14.5" fill="#b6b1a6">Officially recorded intellectual property registration</text>
