# Generates dual-theme contribution snake SVGs matching the Architectural Kinetic Studio palette.
name: Refresh contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        with:
          github_user_name: Sutannn13
          outputs: |
            assets/snake-light.svg?palette=github-light&color_snake=%23b5451b&color_dots=%23eee9df,%23e2c7b8,%23d69d83,%23c76d49,%23b5451b
            assets/snake-dark.svg?palette=github-dark&color_snake=%23e57a52&color_dots=%231c2028,%233b2720,%23663829,%239e4f34,%23e57a52

      - name: Commit updated contribution snakes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/snake-light.svg assets/snake-dark.svg
          git diff --cached --quiet || git commit -m "chore: refresh contribution snake"
          git push
