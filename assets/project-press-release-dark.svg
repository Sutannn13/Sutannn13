<svg xmlns="http://www.w3.org/2000/svg" width="380" height="252" viewBox="0 0 380 252" role="img" aria-label="Press Release Generator: TypeScript tool converting structured 5W+1H field notes into consistent press release drafts.">
  <style>
    @keyframes sheetA { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-7px); } }
    @keyframes sheetB { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-12px); } }
    .sa { animation: sheetA 4.4s ease-in-out infinite; }
    .sb { animation: sheetB 4.4s ease-in-out 0.35s infinite; }
    @media (prefers-reduced-motion: reduce) { .sa, .sb { animation: none !important; } }
  </style>
  <rect x="0.75" y="0.75" width="378.5" height="250.5" rx="10" fill="#14171c" stroke="#2c323c" stroke-width="1.5"/>
