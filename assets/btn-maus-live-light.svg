<svg xmlns="http://www.w3.org/2000/svg" width="580" height="58" viewBox="0 0 580 58" role="img" aria-label="Open maukitchen.my.id: LIVE SITE">
  <style>
    @keyframes scanBtn {
      0%, 100% { transform: translateX(0px); }
      50% { transform: translateX(22px); }
    }
    @keyframes barSweep {
      0%, 74% { transform: translateX(-600px); opacity: 0; }
      84% { opacity: 0.35; }
      94% { opacity: 0.35; }
      100% { transform: translateX(600px); opacity: 0; }
    }
    .scan { animation: scanBtn 4.0s ease-in-out infinite; }
    .bsweep { animation: barSweep 7.2s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { .scan, .bsweep { animation: none !important; } }
  </style>
  <defs>
    <clipPath id="bc"><rect x="1" y="1" width="578" height="56" rx="8"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b5451b" stop-opacity="0"/>
      <stop offset="50%" stop-color="#b5451b" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#b5451b" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0.75" y="0.75" width="578.5" height="56.5" rx="8" fill="#f7f4ee" stroke="#b5451b" stroke-width="1.4"/>
  <g clip-path="url(#bc)"><rect x="0" y="0" width="160" height="58" fill="url(#bg)" class="bsweep"/></g>
  <rect x="22" y="25" width="12" height="8" rx="1.5" fill="#b5451b" class="scan"/>
  <text x="64" y="35" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#161614">Open maukitchen.my.id</text>
  <rect x="434" y="15" width="124" height="28" rx="4" fill="#e4f0e8" stroke="#1e6b43" stroke-width="1"/>
  <text x="496" y="33" text-anchor="middle" font-family="'Cascadia Mono', Consolas, ui-monospace, monospace" font-size="12" font-weight="700" fill="#1e6b43">LIVE SITE</text>
</svg>
