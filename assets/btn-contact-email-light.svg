<svg xmlns="http://www.w3.org/2000/svg" width="580" height="62" viewBox="0 0 580 62" role="img" aria-label="Start a conversation (EMAIL DIRECT)">
  <style>
    @keyframes barSweep {
      0%, 74% { transform: translateX(-620px); opacity: 0; }
      85% { opacity: 0.32; }
      95% { opacity: 0.32; }
      100% { transform: translateX(620px); opacity: 0; }
    }
    @keyframes nudge {
      0%, 100% { transform: translateX(0px); }
      50% { transform: translateX(2.5px); }
    }
    .bsweep { animation: barSweep 7.6s cubic-bezier(0.32, 0.72, 0, 1) infinite; }
    .nudge { animation: nudge 3.8s cubic-bezier(0.32, 0.72, 0, 1) infinite; }
    @media (prefers-reduced-motion: reduce) { .bsweep, .nudge { animation: none !important; } }
  </style>
  <defs>
    <clipPath id="bc"><rect x="1" y="1" width="578" height="60" rx="12"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b5451b" stop-opacity="0"/>
      <stop offset="50%" stop-color="#b5451b" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#b5451b" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0.75" y="0.75" width="578.5" height="60.5" rx="12" fill="#f7f4ee" stroke="#b5451b" stroke-width="1.3"/>
  <line x1="16" y1="1.6" x2="564" y2="1.6" stroke="#ffffff" stroke-opacity="0.85" stroke-width="1"/>
  <g clip-path="url(#bc)"><rect x="0" y="0" width="170" height="62" fill="url(#bg)" class="bsweep"/></g>

  <text x="26" y="37" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="17" font-weight="700" letter-spacing="-0.2" fill="#161614">Start a conversation</text>

  <rect x="384" y="17" width="122" height="28" rx="6" fill="#ece6db" stroke="#d6cfc2" stroke-width="1"/>
  <text x="445" y="35" text-anchor="middle" font-family="'Cascadia Mono', Consolas, ui-monospace, monospace" font-size="11.5" font-weight="700" fill="#b5451b">EMAIL DIRECT</text>

  <!-- Button-in-Button trailing icon island -->
  <circle cx="544" cy="31" r="16" fill="#ece6db" stroke="#d6cfc2" stroke-width="1"/>
  <path d="M541,26 L547,31 L541,36" fill="none" stroke="#b5451b" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" class="nudge"/>
</svg>
