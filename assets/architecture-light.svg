<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-label="How I build: From database schema to deployed product across Data and Domain, API and Automation, and Product Interface.">
  <style>
    @keyframes floatA { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-7px); } }
    @keyframes floatB { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-11px); } }
    @keyframes floatC { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-6px); } }
    @keyframes flowDash { from { stroke-dashoffset: 64; } to { stroke-dashoffset: 0; } }
    @keyframes revDash { from { stroke-dashoffset: 0; } to { stroke-dashoffset: 64; } }
    @keyframes pktFwd { 0% { transform: translateX(0px); opacity: 0; } 14% { opacity: 1; } 86% { opacity: 1; } 100% { transform: translateX(188px); opacity: 0; } }
    @keyframes pktBack { 0% { transform: translateX(188px); opacity: 0; } 14% { opacity: 0.9; } 86% { opacity: 0.9; } 100% { transform: translateX(0px); opacity: 0; } }
    @keyframes orbitRing { 0%, 100% { stroke-dashoffset: 0; opacity: 0.65; } 50% { stroke-dashoffset: 64; opacity: 1; } }
    .f-a { animation: floatA 4.8s cubic-bezier(0.32, 0.72, 0, 1) infinite; }
    .f-b { animation: floatB 5.4s cubic-bezier(0.32, 0.72, 0, 1) infinite; }
    .f-c { animation: floatC 5.0s cubic-bezier(0.32, 0.72, 0, 1) infinite; }
    .f-b2 { animation: floatA 5.4s cubic-bezier(0.32, 0.72, 0, 1) 0.55s infinite; }
    .f-c2 { animation: floatB 5.0s cubic-bezier(0.32, 0.72, 0, 1) 0.75s infinite; }
    .conduit { stroke-dasharray: 6 10; animation: flowDash 2.4s linear infinite; }
    .conduit-r { stroke-dasharray: 4 12; animation: revDash 3.2s linear infinite; }
    .pkt1 { animation: pktFwd 2.6s cubic-bezier(0.32, 0.72, 0, 1) infinite; }
    .pkt2 { animation: pktFwd 2.6s cubic-bezier(0.32, 0.72, 0, 1) 1.3s infinite; }
    .pkt3 { animation: pktBack 3.4s cubic-bezier(0.32, 0.72, 0, 1) 0.5s infinite; }
    .pkt4 { animation: pktBack 3.4s cubic-bezier(0.32, 0.72, 0, 1) 2.1s infinite; }
    .ring { animation: orbitRing 7.4s linear infinite; }
    @media (prefers-reduced-motion: reduce) {
      .f-a, .f-b, .f-c, .f-b2, .f-c2, .conduit, .conduit-r, .pkt1, .pkt2, .pkt3, .pkt4, .ring { animation: none !important; }
    }
  </style>
  <defs>
    <filter id="sblur" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="5.5"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
    </filter>
    <linearGradient id="sl-t" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#eee8dd"/><stop offset="100%" stop-color="#dbd3c5"/></linearGradient>
    <linearGradient id="sl-l" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dbd3c5"/><stop offset="100%" stop-color="#c1b8a8"/></linearGradient>
    <linearGradient id="sl-r" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#c1b8a8"/><stop offset="100%" stop-color="#a99f8e"/></linearGradient>

    <linearGradient id="ac-t" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#df6b40"/><stop offset="100%" stop-color="#b5451b"/></linearGradient>
    <linearGradient id="ac-l" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#b5451b"/><stop offset="100%" stop-color="#78280b"/></linearGradient>
    <linearGradient id="ac-r" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#78280b"/><stop offset="100%" stop-color="#a99f8e"/></linearGradient>

    <linearGradient id="br-t" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ad7d33"/><stop offset="100%" stop-color="#7d5318"/></linearGradient>
    <linearGradient id="br-l" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7d5318"/><stop offset="100%" stop-color="#4f330a"/></linearGradient>
    <linearGradient id="br-r" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#4f330a"/><stop offset="100%" stop-color="#a99f8e"/></linearGradient>

    <radialGradient id="spot-warm" cx="78%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#b5451b" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#b5451b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spot-brass" cx="76%" cy="50%" r="46%">
      <stop offset="0%" stop-color="#7d5318" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#7d5318" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spot-mini" cx="82%" cy="36%" r="36%">
      <stop offset="0%" stop-color="#b5451b" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#b5451b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0.75" y="0.75" width="1198.5" height="428.5" rx="12" fill="#f1ece3" stroke="#d6cfc2" stroke-width="1.15"/><line x1="16" y1="1.6" x2="1184" y2="1.6" stroke="#ffffff" stroke-opacity="0.88" stroke-width="1"/>

  <text x="48" y="64" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="25" font-weight="700" letter-spacing="-0.5" fill="#161614">From database schema to deployed product.</text>
  <text x="48" y="96" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="16" fill="#4a4741">Information Technology student and backend-focused full-stack developer in Depok, Indonesia. Turning manual</text>
  <text x="48" y="120" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="16" fill="#4a4741">processes and scattered operational data into dependable APIs, workflows, and clear web interfaces.</text>
  <line x1="48" y1="146" x2="1152" y2="146" stroke="#d6cfc2" stroke-width="1"/>

