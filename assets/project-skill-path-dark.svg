<svg xmlns="http://www.w3.org/2000/svg" width="580" height="268" viewBox="0 0 580 268" role="img" aria-label="Skill Path AI: maps an existing profile into a practical skill roadmap and career direction. Open source TypeScript repository.">
  <style>
    @keyframes climb {
      0%, 10% { transform: translate(0px, 0px); }
      26%, 32% { transform: translate(30px, -30px); }
      48%, 54% { transform: translate(60px, -62px); }
      70%, 76% { transform: translate(90px, -94px); }
      90%, 100% { transform: translate(120px, -128px); }
    }
    .beacon { animation: climb 5.4s cubic-bezier(0.45, 0, 0.25, 1) infinite alternate; }
    @media (prefers-reduced-motion: reduce) {
      .beacon { animation: none !important; transform: translate(120px, -128px); }
    }
  </style>
  <rect x="0.75" y="0.75" width="578.5" height="266.5" rx="10" fill="#14171c" stroke="#2c323c" stroke-width="1.5"/>
  <g stroke="#5b6575" stroke-width="1.15" opacity="0.65" fill="none"><path d="M16,26 L16,16 L26,16"/><path d="M554,16 L564,16 L564,26"/><path d="M16,242 L16,252 L26,252"/><path d="M554,252 L564,252 L564,242"/></g>

  <text x="32" y="42" font-family="Cascadia Mono, Consolas, ui-monospace, monospace" font-size="12" fill="#969187">OPEN SOURCE · 3 STARS</text>
  <text x="32" y="86" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" fill="#f3efe6">Skill Path AI</text>
  <rect x="32" y="100" width="36" height="2.5" fill="#e57a52"/>

  <text x="32" y="134" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="15.5" fill="#b6b1a6">Turns an existing profile into</text>
  <text x="32" y="158" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="15.5" fill="#b6b1a6">a practical skill roadmap and</text>
  <text x="32" y="182" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="15.5" fill="#b6b1a6">clear career direction.</text>

  <g font-family="Cascadia Mono, Consolas, ui-monospace, monospace" font-size="12" fill="#f3efe6">
    <rect x="32" y="210" width="98" height="26" rx="4" fill="#1c2028" stroke="#2c323c"/>
    <text x="81" y="227" text-anchor="middle">TypeScript</text>
    <rect x="140" y="210" width="98" height="26" rx="4" fill="#1c2028" stroke="#2c323c"/>
    <text x="189" y="227" text-anchor="middle">Roadmap AI</text>
  </g>

