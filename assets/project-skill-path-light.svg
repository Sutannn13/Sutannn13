<svg xmlns="http://www.w3.org/2000/svg" width="580" height="286" viewBox="0 0 580 286" role="img" aria-label="Skill Path AI: maps an existing profile into a practical skill roadmap and career direction. Open source TypeScript repository with 3 stars.">
  <style>
    @keyframes climb {
      0%, 10% { transform: translate(0px, 0px); }
      26%, 32% { transform: translate(30px, -32px); }
      48%, 54% { transform: translate(60px, -66px); }
      70%, 76% { transform: translate(90px, -100px); }
      90%, 100% { transform: translate(120px, -136px); }
    }
    @keyframes towerFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    .beacon { animation: climb 5.2s cubic-bezier(0.45, 0, 0.25, 1) infinite alternate; }
    .tfloat { animation: towerFloat 6s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .beacon { animation: none !important; transform: translate(120px, -136px); }
      .tfloat { animation: none !important; }
    }
  </style>
  <rect x="0.75" y="0.75" width="578.5" height="284.5" rx="10" fill="#f7f4ee" stroke="#d6cfc2" stroke-width="1.5"/>
  <g stroke="#766f64" stroke-width="1.15" opacity="0.65" fill="none"><path d="M16,26 L16,16 L26,16"/><path d="M554,16 L564,16 L564,26"/><path d="M16,260 L16,270 L26,270"/><path d="M554,270 L564,270 L564,260"/></g>

  <text x="32" y="42" font-family="'Cascadia Mono', Consolas, ui-monospace, monospace" font-size="12.5" fill="#5c5850">OPEN SOURCE · 3 STARS</text>
  <text x="32" y="88" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#161614">Skill Path AI</text>
  <rect x="32" y="102" width="38" height="2.5" fill="#b5451b"/>

  <text x="32" y="138" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="16" fill="#4a4741">Turns an existing profile into</text>
  <text x="32" y="162" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="16" fill="#4a4741">a practical skill roadmap and</text>
  <text x="32" y="186" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="16" fill="#4a4741">clear career direction.</text>

  <g font-family="'Cascadia Mono', Consolas, ui-monospace, monospace" font-size="12.5" fill="#161614">
    <rect x="32" y="204" width="100" height="26" rx="4" fill="#eee9df" stroke="#d6cfc2"/>
