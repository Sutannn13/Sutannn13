<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="424" viewBox="0 0 1200 424" role="img" aria-label="How I build: From database schema to deployed product across Data and Domain, API and Automation, and Product Interface.">
  <style>
    @keyframes floatA { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-7px); } }
    @keyframes floatB { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-11px); } }
    @keyframes floatC { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-6px); } }
    @keyframes flowDash { from { stroke-dashoffset: 64; } to { stroke-dashoffset: 0; } }
    @keyframes revDash { from { stroke-dashoffset: 0; } to { stroke-dashoffset: 64; } }
    @keyframes pktFwd {
      0% { transform: translateX(0px); opacity: 0; }
      14% { opacity: 1; }
      86% { opacity: 1; }
      100% { transform: translateX(188px); opacity: 0; }
    }
    @keyframes pktBack {
      0% { transform: translateX(188px); opacity: 0; }
      14% { opacity: 0.9; }
      86% { opacity: 0.9; }
      100% { transform: translateX(0px); opacity: 0; }
    }
    @keyframes orbitRing {
      0%, 100% { stroke-dashoffset: 0; opacity: 0.65; }
      50% { stroke-dashoffset: 64; opacity: 1; }
    }
    .f-a { animation: floatA 4.8s cubic-bezier(0.32, 0.72, 0, 1) infinite; }
    .f-b { animation: floatB 5.4s cubic-bezier(0.32, 0.72, 0, 1) infinite; }
    .f-c { animation: floatC 5.0s cubic-bezier(0.32, 0.72, 0, 1) infinite; }
    .f-b2 { animation: floatA 5.4s cubic-bezier(0.32, 0.72, 0, 1) 0.55s infinite; }
    .f-c2 { animation: floatB 5.0s cubic-bezier(0.32, 0.72, 0, 1) 0.75s infinite; }
    .conduit { stroke-dasharray: 6 10; animation: flowDash 2.4s linear infinite; }
    .conduit-r { stroke-dasharray: 4 12; animation: revDash 3.2s linear infinite; }
    .pkt1 { animation: pktFwd 2.6s cubic-bezier(0.32, 0.72, 0, 1) infinite; }
    .pkt2 { animation: pktFwd 2.6s cubic-bezier(0.32, 0.72, 0, 1) 1.3s infinite; }
    .pkt3 { animation: pktBack 3.4s cubic-bezier(0.32, 0.72, 0, 1) 0.5s infinite; }
    .pkt4 { animation: pktBack 3.4s cubic-bezier(0.32, 0.72, 0, 1) 2.1s infinite; }
    .ring { animation: orbitRing 7.4s linear infinite; }
    @media (prefers-reduced-motion: reduce) {
      .f-a, .f-b, .f-c, .f-b2, .f-c2, .conduit, .conduit-r, .pkt1, .pkt2, .pkt3, .pkt4, .ring { animation: none !important; }
    }
  </style>
  <defs>
    <filter id="sblur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5.5"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
    </filter>
    <linearGradient id="sl-t" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#394252"/><stop offset="100%" stop-color="#262d3a"/></linearGradient>
    <linearGradient id="sl-l" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#262d3a"/><stop offset="100%" stop-color="#181d26"/></linearGradient>
    <linearGradient id="sl-r" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#181d26"/><stop offset="100%" stop-color="#07090d"/></linearGradient>

    <linearGradient id="ac-t" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f7a889"/><stop offset="100%" stop-color="#d96c43"/></linearGradient>
    <linearGradient id="ac-l" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#d96c43"/><stop offset="100%" stop-color="#8c3b1e"/></linearGradient>
    <linearGradient id="ac-r" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#8c3b1e"/><stop offset="100%" stop-color="#07090d"/></linearGradient>

    <linearGradient id="br-t" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f0cb8d"/><stop offset="100%" stop-color="#c48d44"/></linearGradient>
    <linearGradient id="br-l" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#c48d44"/><stop offset="100%" stop-color="#7c5522"/></linearGradient>
    <linearGradient id="br-r" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7c5522"/><stop offset="100%" stop-color="#07090d"/></linearGradient>

    <radialGradient id="spot-warm" cx="78%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#e57a52" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#e57a52" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spot-brass" cx="76%" cy="50%" r="46%">
      <stop offset="0%" stop-color="#d9a45b" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#d9a45b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0.75" y="0.75" width="1198.5" height="422.5" rx="12" fill="#11141a" stroke="#2a313d" stroke-width="1.15"/><line x1="16" y1="1.6" x2="1184" y2="1.6" stroke="#ffffff" stroke-opacity="0.11" stroke-width="1"/>

  <!-- Clean editorial lead without eyebrow bloat -->
  <text x="48" y="64" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="25" font-weight="700" letter-spacing="-0.5" fill="#f3efe6">From database schema to deployed product.</text>
  <text x="48" y="96" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="16" fill="#b6b1a6">Information Technology student and backend-focused full-stack developer in Depok, Indonesia. Turning manual</text>
  <text x="48" y="120" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="16" fill="#b6b1a6">processes and scattered operational data into dependable APIs, workflows, and clear web interfaces.</text>
  <line x1="48" y1="146" x2="1152" y2="146" stroke="#2a313d" stroke-width="1"/>

  <!-- Soft Gaussian-blurred tinted studio contact shadows -->
  <ellipse cx="210" cy="316" rx="74" ry="20" fill="#07090d" opacity="0.58" filter="url(#sblur)"/>
  <ellipse cx="600" cy="322" rx="86" ry="24" fill="#07090d" opacity="0.62" filter="url(#sblur)"/>
  <ellipse cx="990" cy="316" rx="74" ry="20" fill="#07090d" opacity="0.58" filter="url(#sblur)"/>

  <!-- Bidirectional studio glass conduits -->
  <g fill="none">
    <line x1="306" y1="262" x2="494" y2="262" stroke="#2a313d" stroke-width="4" stroke-linecap="round"/>
    <line x1="306" y1="262" x2="494" y2="262" stroke="#e57a52" stroke-width="1.6" class="conduit"/>
    <line x1="306" y1="278" x2="494" y2="278" stroke="#2a313d" stroke-width="1.4" class="conduit-r"/>

    <line x1="706" y1="262" x2="894" y2="262" stroke="#2a313d" stroke-width="4" stroke-linecap="round"/>
    <line x1="706" y1="262" x2="894" y2="262" stroke="#e57a52" stroke-width="1.6" class="conduit"/>
    <line x1="706" y1="278" x2="894" y2="278" stroke="#2a313d" stroke-width="1.4" class="conduit-r"/>
  </g>
  <g class="pkt1"><polygon points="306,256 318,262 306,268 294,262" fill="#e57a52"/></g>
  <g class="pkt2"><polygon points="706,256 718,262 706,268 694,262" fill="#e57a52"/></g>
  <g class="pkt3"><polygon points="306,274 314,278 306,282 298,278" fill="#d9a45b"/></g>
  <g class="pkt4"><polygon points="706,274 714,278 706,282 698,278" fill="#d9a45b"/></g>

  <g><polygon points="152.0,274.0 210.0,301.0 210.0,317.0 152.0,290.0" fill="url(#sl-l)"/><polygon points="268.0,274.0 210.0,301.0 210.0,317.0 268.0,290.0" fill="url(#sl-r)"/><polygon points="210.0,247.0 268.0,274.0 210.0,301.0 152.0,274.0" fill="url(#sl-t)"/><polyline points="152.0,274.0 210.0,301.0 268.0,274.0" fill="none" stroke="#fff4e6" stroke-opacity="0.26" stroke-width="1.15" stroke-linejoin="round"/><g class="f-a"><polygon points="152.0,247.0 210.0,274.0 210.0,290.0 152.0,263.0" fill="url(#sl-l)"/><polygon points="268.0,247.0 210.0,274.0 210.0,290.0 268.0,263.0" fill="url(#sl-r)"/><polygon points="210.0,220.0 268.0,247.0 210.0,274.0 152.0,247.0" fill="url(#sl-t)"/><polyline points="152.0,247.0 210.0,274.0 268.0,247.0" fill="none" stroke="#fff4e6" stroke-opacity="0.26" stroke-width="1.15" stroke-linejoin="round"/></g><g class="f-b"><polygon points="152.0,220.0 210.0,247.0 210.0,263.0 152.0,236.0" fill="url(#ac-l)"/><polygon points="268.0,220.0 210.0,247.0 210.0,263.0 268.0,236.0" fill="url(#ac-r)"/><polygon points="210.0,193.0 268.0,220.0 210.0,247.0 152.0,220.0" fill="url(#ac-t)"/><polyline points="152.0,220.0 210.0,247.0 268.0,220.0" fill="none" stroke="#fff4e6" stroke-opacity="0.26" stroke-width="1.15" stroke-linejoin="round"/></g></g>
  <g>
    <polygon points="528.0,281.0 600.0,314.0 600.0,329.0 528.0,296.0" fill="url(#sl-l)"/><polygon points="672.0,281.0 600.0,314.0 600.0,329.0 672.0,296.0" fill="url(#sl-r)"/><polygon points="600.0,248.0 672.0,281.0 600.0,314.0 528.0,281.0" fill="url(#sl-t)"/><polyline points="528.0,281.0 600.0,314.0 672.0,281.0" fill="none" stroke="#fff4e6" stroke-opacity="0.26" stroke-width="1.15" stroke-linejoin="round"/>
    <ellipse cx="600" cy="260" rx="88" ry="34" fill="none" stroke="#d9a45b" stroke-width="1.6" stroke-dasharray="10 6" class="ring"/>
    <g class="f-a"><polygon points="560.0,229.0 600.0,248.0 600.0,296.0 560.0,277.0" fill="url(#ac-l)"/><polygon points="640.0,229.0 600.0,248.0 600.0,296.0 640.0,277.0" fill="url(#ac-r)"/><polygon points="600.0,210.0 640.0,229.0 600.0,248.0 560.0,229.0" fill="url(#ac-t)"/><polyline points="560.0,229.0 600.0,248.0 640.0,229.0" fill="none" stroke="#fff4e6" stroke-opacity="0.26" stroke-width="1.15" stroke-linejoin="round"/></g>
    <g class="f-b2"><polygon points="552.0,209.0 600.0,231.0 600.0,244.0 552.0,222.0" fill="url(#br-l)"/><polygon points="648.0,209.0 600.0,231.0 600.0,244.0 648.0,222.0" fill="url(#br-r)"/><polygon points="600.0,187.0 648.0,209.0 600.0,231.0 552.0,209.0" fill="url(#br-t)"/><polyline points="552.0,209.0 600.0,231.0 648.0,209.0" fill="none" stroke="#fff4e6" stroke-opacity="0.26" stroke-width="1.15" stroke-linejoin="round"/></g>
  </g>
  <g><polygon points="928.0,281.0 990.0,309.0 990.0,320.0 928.0,292.0" fill="url(#sl-l)"/><polygon points="1052.0,281.0 990.0,309.0 990.0,320.0 1052.0,292.0" fill="url(#sl-r)"/><polygon points="990.0,253.0 1052.0,281.0 990.0,309.0 928.0,281.0" fill="url(#sl-t)"/><polyline points="928.0,281.0 990.0,309.0 1052.0,281.0" fill="none" stroke="#fff4e6" stroke-opacity="0.26" stroke-width="1.15" stroke-linejoin="round"/><g class="f-c"><polygon points="936.0,252.0 990.0,277.0 990.0,288.0 936.0,263.0" fill="url(#sl-l)"/><polygon points="1044.0,252.0 990.0,277.0 990.0,288.0 1044.0,263.0" fill="url(#sl-r)"/><polygon points="990.0,227.0 1044.0,252.0 990.0,277.0 936.0,252.0" fill="url(#sl-t)"/><polyline points="936.0,252.0 990.0,277.0 1044.0,252.0" fill="none" stroke="#fff4e6" stroke-opacity="0.26" stroke-width="1.15" stroke-linejoin="round"/></g><g class="f-c2"><polygon points="946.0,223.0 990.0,243.0 990.0,254.0 946.0,234.0" fill="url(#br-l)"/><polygon points="1034.0,223.0 990.0,243.0 990.0,254.0 1034.0,234.0" fill="url(#br-r)"/><polygon points="990.0,203.0 1034.0,223.0 990.0,243.0 946.0,223.0" fill="url(#br-t)"/><polyline points="946.0,223.0 990.0,243.0 1034.0,223.0" fill="none" stroke="#fff4e6" stroke-opacity="0.26" stroke-width="1.15" stroke-linejoin="round"/></g></g>

  <g text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif">
    <text x="210" y="362" font-size="19.5" font-weight="700" letter-spacing="-0.3" fill="#f3efe6">Data &amp; Domain</text>
    <text x="210" y="388" font-size="14.5" fill="#b6b1a6">MySQL · Supabase · Schema Design</text>

    <text x="600" y="362" font-size="19.5" font-weight="700" letter-spacing="-0.3" fill="#f3efe6">API &amp; Automation</text>
    <text x="600" y="388" font-size="14.5" fill="#b6b1a6">Laravel · PHP · REST API · Workflows</text>

    <text x="990" y="362" font-size="19.5" font-weight="700" letter-spacing="-0.3" fill="#f3efe6">Product Interface</text>
