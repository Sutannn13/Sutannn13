<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="Trail map with three stops: Now building, Next improving, Open for opportunities">
  <defs>
    <g id="pine">
      <path d="M0,-72 L17,-34 L9,-34 L21,-6 L-21,-6 L-9,-34 L-17,-34 Z"/>
      <rect x="-3" y="-6" width="6" height="14"/>
    </g>
  </defs>
  <rect width="1200" height="150" rx="12" fill="#0b1f16" stroke="#1b4332"/>
  <path d="M40,112 C240,42 360,132 560,82 C760,32 860,42 1160,92" fill="none" stroke="#2d6a4f" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 14">
    <animate attributeName="stroke-dashoffset" values="0;-150" dur="8s" repeatCount="indefinite"/>
  </path>
  <g fill="#1b4332">
    <use href="#pine" x="72" y="138" transform="scale(0.55)"/>
    <use href="#pine" x="1130" y="138" transform="scale(0.5)"/>
  </g>
  <g font-family="Verdana, sans-serif" text-anchor="middle">
    <circle cx="230" cy="80" r="16" fill="#1b4332" stroke="#d49b35" stroke-width="2"/>
    <circle cx="230" cy="80" r="5" fill="#d49b35"/>
    <text x="230" y="48" font-size="14" font-weight="bold" fill="#f1efe6">NOW</text>
    <text x="230" y="122" font-size="11" fill="#7fa08d">BUILDING</text>
    <circle cx="600" cy="84" r="16" fill="#1b4332" stroke="#d49b35" stroke-width="2"/>
    <circle cx="600" cy="84" r="5" fill="#d49b35"/>
    <text x="600" y="52" font-size="14" font-weight="bold" fill="#f1efe6">NEXT</text>
    <text x="600" y="126" font-size="11" fill="#7fa08d">IMPROVING</text>
    <circle cx="960" cy="74" r="16" fill="#1b4332" stroke="#d49b35" stroke-width="2"/>
    <circle cx="960" cy="74" r="5" fill="#d49b35"/>
    <text x="960" y="42" font-size="14" font-weight="bold" fill="#f1efe6">OPEN</text>
    <text x="960" y="116" font-size="11" fill="#7fa08d">OPPORTUNITIES</text>
  </g>
  <g fill="#e9c46a">
    <circle cx="420" cy="60" r="2.6"><animate attributeName="opacity" values="0.15;1;0.15" dur="4s" repeatCount="indefinite"/><animate attributeName="cy" values="60;48;60" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="52" r="2.2"><animate attributeName="opacity" values="1;0.15;1" dur="5s" repeatCount="indefinite"/><animate attributeName="cy" values="52;42;52" dur="10s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="110" r="2.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="4.4s" repeatCount="indefinite"/><animate attributeName="cy" values="110;98;110" dur="8s" repeatCount="indefinite"/></circle>
  </g>
</svg>
