<svg xmlns="http://www.w3.org/2000/svg" width="260" height="74" viewBox="0 0 260 74" role="img" aria-label="Email: Direct mail">
  <style>
    @keyframes sweep {
      0%, 72% { transform: translateX(-290px); opacity: 0; }
      82% { opacity: 0.45; }
      94% { opacity: 0.45; }
      100% { transform: translateX(290px); opacity: 0; }
    }
    @keyframes glyphBob {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-2.5px); }
    }
    .sheen { animation: sweep 6.4s ease-in-out 2.40s infinite; }
    .gbob { animation: glyphBob 4.2s ease-in-out 2.40s infinite; }
    @media (prefers-reduced-motion: reduce) {
      .sheen, .gbob { animation: none !important; }
    }
  </style>
  <defs>
    <clipPath id="tc"><rect x="1" y="1" width="258" height="72" rx="8"/></clipPath>
    <linearGradient id="sg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e57a52" stop-opacity="0"/>
      <stop offset="50%" stop-color="#e57a52" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#e57a52" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0.75" y="0.75" width="258.5" height="72.5" rx="8" fill="#14171c" stroke="#2c323c" stroke-width="1.5"/>
  <g clip-path="url(#tc)">
    <rect x="0" y="0" width="96" height="74" fill="url(#sg)" class="sheen"/>
  </g>
  <rect x="18" y="13" width="24" height="2.5" fill="#e57a52"/>
  <g class="gbob"><polygon points="23.5,41.0 37.0,47.2 37.0,57.2 23.5,51.0" fill="#c28e46" stroke="#2c323c" stroke-width="0.9" stroke-linejoin="round"/><polygon points="50.5,41.0 37.0,47.2 37.0,57.2 50.5,51.0" fill="#8f652c" stroke="#2c323c" stroke-width="0.9" stroke-linejoin="round"/><polygon points="37.0,34.8 50.5,41.0 37.0,47.2 23.5,41.0" fill="#e6b877" stroke="#2c323c" stroke-width="0.9" stroke-linejoin="round"/></g>
  <text x="68" y="37" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="17.5" font-weight="700" fill="#f3efe6">Email</text>
  <text x="68" y="57" font-family="'Cascadia Mono', Consolas, ui-monospace, monospace" font-size="12.5" fill="#969187">Direct mail</text>
</svg>
