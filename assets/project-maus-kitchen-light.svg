<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="272" viewBox="0 0 1200 272" role="img" aria-label="Flagship live product: Mau's Kitchen. Menu discovery, ordering, and daily operations for an active kitchen. Live at maukitchen.my.id.">
  <style>
    @keyframes liftA { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-6px); } }
    @keyframes liftB { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
    @keyframes orderFlow1 {
      0% { transform: translate(0px, 0px); opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { transform: translate(126px, -18px); opacity: 0; }
    }
    @keyframes orderFlow2 {
      0% { transform: translate(0px, 0px); opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { transform: translate(122px, 30px); opacity: 0; }
    }
    @keyframes railDash { from { stroke-dashoffset: 36; } to { stroke-dashoffset: 0; } }
    .la { animation: liftA 4.8s ease-in-out infinite; }
    .lb { animation: liftB 4.8s ease-in-out 0.6s infinite; }
    .lc { animation: liftA 4.8s ease-in-out 1.2s infinite; }
    .of1 { animation: orderFlow1 3.0s ease-in-out infinite; }
    .of2 { animation: orderFlow2 3.0s ease-in-out 1.5s infinite; }
    .rail { stroke-dasharray: 5 7; animation: railDash 2.2s linear infinite; }
    @media (prefers-reduced-motion: reduce) {
      .la, .lb, .lc, .of1, .of2, .rail { animation: none !important; }
    }
  </style>
  <rect x="0.75" y="0.75" width="1198.5" height="270.5" rx="10" fill="#f7f4ee" stroke="#d6cfc2" stroke-width="1.5"/>
  <g stroke="#766f64" stroke-width="1.15" opacity="0.65" fill="none"><path d="M16,26 L16,16 L26,16"/><path d="M1174,16 L1184,16 L1184,26"/><path d="M16,246 L16,256 L26,256"/><path d="M1174,256 L1184,256 L1184,246"/></g>

  <rect x="44" y="34" width="146" height="26" rx="4" fill="#e4f0e8" stroke="#1e6b43" stroke-width="1"/>
  <text x="117" y="51" text-anchor="middle" font-family="'Cascadia Mono', Consolas, ui-monospace, monospace" font-size="11.5" font-weight="700" fill="#1e6b43">LIVE PRODUCTION</text>
  <text x="206" y="51" font-family="'Cascadia Mono', Consolas, ui-monospace, monospace" font-size="13" fill="#5c5850">maukitchen.my.id</text>

  <text x="44" y="106" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="700" fill="#161614">Mau's Kitchen</text>
  <rect x="44" y="122" width="48" height="2.5" fill="#b5451b"/>

  <text x="44" y="158" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="16.5" fill="#4a4741">Customer menu discovery, structured ordering, and daily kitchen</text>
  <text x="44" y="182" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="16.5" fill="#4a4741">admin operations running in production for an active food business.</text>

  <g font-family="'Cascadia Mono', Consolas, ui-monospace, monospace" font-size="12.5" fill="#161614">
    <rect x="44" y="210" width="102" height="28" rx="4" fill="#eee9df" stroke="#d6cfc2"/>
    <text x="95" y="229" text-anchor="middle">TypeScript</text>
    <rect x="156" y="210" width="132" height="28" rx="4" fill="#eee9df" stroke="#d6cfc2"/>
    <text x="222" y="229" text-anchor="middle">Operations UI</text>
    <rect x="298" y="210" width="116" height="28" rx="4" fill="#eee9df" stroke="#d6cfc2"/>
    <text x="356" y="229" text-anchor="middle">Order Flow</text>
  </g>

  <line x1="716" y1="34" x2="716" y2="238" stroke="#d6cfc2" stroke-width="1" stroke-dasharray="3 5"/>

  <ellipse cx="836" cy="196" rx="60" ry="18" fill="#c9c1b2" opacity="0.4"/>
  <ellipse cx="962" cy="184" rx="66" ry="20" fill="#c9c1b2" opacity="0.45"/>
  <ellipse cx="1084" cy="208" rx="60" ry="18" fill="#c9c1b2" opacity="0.4"/>

  <line x1="836" y1="158" x2="962" y2="140" stroke="#b5451b" stroke-width="1.8" class="rail"/>
  <line x1="962" y1="140" x2="1084" y2="170" stroke="#7d5318" stroke-width="1.8" class="rail"/>

  <g class="la"><polygon points="780.0,157.0 836.0,182.0 836.0,195.0 780.0,170.0" fill="#d9d2c4" stroke="#d6cfc2" stroke-width="0.9" stroke-linejoin="round"/><polygon points="892.0,157.0 836.0,182.0 836.0,195.0 892.0,170.0" fill="#c7bfb0" stroke="#d6cfc2" stroke-width="0.9" stroke-linejoin="round"/><polygon points="836.0,132.0 892.0,157.0 836.0,182.0 780.0,157.0" fill="#e7e1d5" stroke="#d6cfc2" stroke-width="0.9" stroke-linejoin="round"/></g>
  <g class="lb"><polygon points="902.0,137.0 962.0,164.0 962.0,179.0 902.0,152.0" fill="#b5451b" stroke="#d6cfc2" stroke-width="0.9" stroke-linejoin="round"/><polygon points="1022.0,137.0 962.0,164.0 962.0,179.0 1022.0,152.0" fill="#873110" stroke="#d6cfc2" stroke-width="0.9" stroke-linejoin="round"/><polygon points="962.0,110.0 1022.0,137.0 962.0,164.0 902.0,137.0" fill="#d46035" stroke="#d6cfc2" stroke-width="0.9" stroke-linejoin="round"/></g>
  <g class="lc"><polygon points="1028.0,169.0 1084.0,194.0 1084.0,207.0 1028.0,182.0" fill="#7d5318" stroke="#d6cfc2" stroke-width="0.9" stroke-linejoin="round"/><polygon points="1140.0,169.0 1084.0,194.0 1084.0,207.0 1140.0,182.0" fill="#5c3c0e" stroke="#d6cfc2" stroke-width="0.9" stroke-linejoin="round"/><polygon points="1084.0,144.0 1140.0,169.0 1084.0,194.0 1028.0,169.0" fill="#9c6d28" stroke="#d6cfc2" stroke-width="0.9" stroke-linejoin="round"/></g>

  <g class="of1"><polygon points="822.0,131.0 836.0,137.5 836.0,148.5 822.0,142.0" fill="#7d5318"/><polygon points="850.0,131.0 836.0,137.5 836.0,148.5 850.0,142.0" fill="#5c3c0e"/><polygon points="836.0,124.5 850.0,131.0 836.0,137.5 822.0,131.0" fill="#9c6d28"/></g>
  <g class="of2"><polygon points="948.0,113.0 962.0,119.5 962.0,130.5 948.0,124.0" fill="#b5451b"/><polygon points="976.0,113.0 962.0,119.5 962.0,130.5 976.0,124.0" fill="#873110"/><polygon points="962.0,106.5 976.0,113.0 962.0,119.5 948.0,113.0" fill="#d46035"/></g>

  <g text-anchor="middle" font-family="'Cascadia Mono', Consolas, ui-monospace, monospace" font-size="13" font-weight="600" fill="#4a4741">
    <text x="836" y="238">MENU</text>
    <text x="962" y="238">QUEUE</text>
    <text x="1084" y="238">SERVED</text>
  </g>
</svg>
