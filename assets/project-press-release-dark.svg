  <text x="26" y="76" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="700" fill="#f3efe6">Press Release</text>
  <text x="26" y="102" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="700" fill="#f3efe6">Generator</text>
  <rect x="26" y="114" width="32" height="2.5" fill="#e57a52"/>
  <text x="26" y="146" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="14.5" fill="#b6b1a6">Turns structured 5W+1H field notes</text>
  <text x="26" y="168" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="14.5" fill="#b6b1a6">into consistent press release drafts.</text>
  <rect x="26" y="182" width="96" height="24" rx="4" fill="#1c2028" stroke="#2c323c"/>
  <text x="74" y="198" text-anchor="middle" font-family="'Cascadia Mono', Consolas, ui-monospace, monospace" font-size="11.5" fill="#f3efe6">TypeScript</text>
  <text x="28" y="227" font-family="'Cascadia Mono', Consolas, ui-monospace, monospace" font-size="11.5" font-weight="700" fill="#e57a52">VIEW REPOSITORY</text>

