<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Forest at night: pine trees, a full moon, fireflies and birds over the name Sutan Arlie Johan">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e2a1e"/>
      <stop offset="0.6" stop-color="#0b1f16"/>
      <stop offset="1" stop-color="#08170f"/>
    </linearGradient>
    <radialGradient id="moonglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e9d8a6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#e9d8a6" stop-opacity="0"/>
    </radialGradient>
    <g id="pine">
      <path d="M0,-72 L17,-34 L9,-34 L21,-6 L-21,-6 L-9,-34 L-17,-34 Z"/>
      <rect x="-3" y="-6" width="6" height="14"/>
    </g>
  </defs>

  <rect width="1200" height="320" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#e8f0e6">
    <circle cx="80" cy="42" r="1.6"><animate attributeName="opacity" values="0.25;1;0.25" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="28" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="58" r="1.8"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="30" r="1.3"><animate attributeName="opacity" values="1;0.25;1" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="52" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="4.6s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="26" r="1.2"><animate attributeName="opacity" values="1;0.3;1" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="890" cy="46" r="1.6"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="90" r="1.1"><animate attributeName="opacity" values="1;0.2;1" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="540" cy="88" r="1.1"><animate attributeName="opacity" values="0.25;1;0.25" dur="4.3s" repeatCount="indefinite"/></circle>
  </g>

  <!-- moon -->
  <circle cx="1030" cy="66" r="58" fill="url(#moonglow)"/>
  <circle cx="1030" cy="66" r="30" fill="#e9d8a6" opacity="0.92"/>
  <circle cx="1020" cy="58" r="6" fill="#d9c48f" opacity="0.7"/>
  <circle cx="1042" cy="74" r="4" fill="#d9c48f" opacity="0.6"/>

  <!-- birds -->
  <g fill="none" stroke="#cfe0d2" stroke-width="2" stroke-linecap="round" opacity="0.75">
    <path d="M0,0 Q7,-7 14,0 Q21,-7 28,0">
      <animateMotion dur="46s" repeatCount="indefinite" path="M-60,72 Q600,34 1260,66"/>
    </path>
    <path d="M0,0 Q6,-6 12,0 Q18,-6 24,0">
      <animateMotion dur="58s" begin="8s" repeatCount="indefinite" path="M-60,96 Q600,66 1260,92"/>
    </path>
  </g>

  <!-- distant tree line -->
  <g fill="#1b4332" opacity="0.85">
    <use href="#pine" x="60" y="252" transform="scale(1.15)"/>
    <use href="#pine" x="150" y="258" transform="scale(0.9)"/>
    <use href="#pine" x="250" y="250" transform="scale(1.3)"/>
    <use href="#pine" x="360" y="258" transform="scale(0.95)"/>
    <use href="#pine" x="470" y="252" transform="scale(1.2)"/>
    <use href="#pine" x="580" y="258" transform="scale(0.85)"/>
    <use href="#pine" x="690" y="250" transform="scale(1.25)"/>
    <use href="#pine" x="800" y="258" transform="scale(0.95)"/>
    <use href="#pine" x="900" y="252" transform="scale(1.15)"/>
    <use href="#pine" x="1120" y="254" transform="scale(1.2)"/>
  </g>

  <!-- mist -->
  <ellipse cx="300" cy="262" rx="260" ry="18" fill="#a7c4b5" opacity="0.07">
    <animate attributeName="cx" values="220;380;220" dur="18s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="850" cy="272" rx="300" ry="16" fill="#a7c4b5" opacity="0.06">
    <animate attributeName="cx" values="920;760;920" dur="22s" repeatCount="indefinite"/>
  </ellipse>

  <!-- title -->
  <text x="60" y="128" font-family="Georgia, 'Times New Roman', serif" font-size="46" letter-spacing="2" fill="#f1efe6">Sutan Arlie Johan</text>
  <rect x="62" y="146" width="64" height="3" fill="#d49b35"/>
  <text x="60" y="178" font-family="Verdana, sans-serif" font-size="17" fill="#b7c9bc">Backend-focused full-stack developer — Depok, Indonesia</text>
  <text x="60" y="204" font-family="Verdana, sans-serif" font-size="14" fill="#7fa08d">Laravel · REST API · MySQL · TypeScript · Next.js · Supabase</text>

  <!-- foreground pines, gently swaying -->
  <g fill="#08170f">
    <use href="#pine" x="1050" y="320" transform="scale(1.9)">
      <animateTransform attributeName="transform" type="rotate" values="-1.2 1050 320;1.2 1050 320;-1.2 1050 320" dur="7s" repeatCount="indefinite" additive="sum"/>
    </use>
    <use href="#pine" x="30" y="320" transform="scale(1.6)">
      <animateTransform attributeName="transform" type="rotate" values="1 30 320;-1 30 320;1 30 320" dur="8.5s" repeatCount="indefinite" additive="sum"/>
    </use>
    <use href="#pine" x="1150" y="320" transform="scale(1.4)"/>
  </g>

  <!-- fireflies -->
  <g fill="#e9c46a">
    <circle cx="420" cy="230" r="3"><animate attributeName="opacity" values="0.15;1;0.15" dur="4s" repeatCount="indefinite"/><animate attributeName="cy" values="230;212;230" dur="9s" repeatCount="indefinite"/><animate attributeName="cx" values="420;438;420" dur="11s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="250" r="2.4"><animate attributeName="opacity" values="1;0.1;1" dur="5.2s" repeatCount="indefinite"/><animate attributeName="cy" values="250;232;250" dur="10s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="225" r="3"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.6s" repeatCount="indefinite"/><animate attributeName="cy" values="225;206;225" dur="8s" repeatCount="indefinite"/><animate attributeName="cx" values="700;682;700" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="240" r="2.4"><animate attributeName="opacity" values="1;0.15;1" dur="4.6s" repeatCount="indefinite"/><animate attributeName="cy" values="240;222;240" dur="9.5s" repeatCount="indefinite"/></circle>
    <circle cx="920" cy="248" r="2.8"><animate attributeName="opacity" values="0.15;1;0.15" dur="5.8s" repeatCount="indefinite"/><animate attributeName="cy" values="248;228;248" dur="11s" repeatCount="indefinite"/></circle>
    <circle cx="980" cy="220" r="2.2"><animate attributeName="opacity" values="1;0.2;1" dur="4.2s" repeatCount="indefinite"/><animate attributeName="cy" values="220;204;220" dur="8.6s" repeatCount="indefinite"/></circle>
  </g>

  <rect y="306" width="1200" height="14" fill="#08170f"/>
</svg>
