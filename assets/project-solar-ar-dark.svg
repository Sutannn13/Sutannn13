<svg xmlns="http://www.w3.org/2000/svg" width="498" height="296" viewBox="0 0 498 296" role="img" aria-label="Solar System AR: interactive WebAR learning experience combining product UI and 3D augmented reality with A-Frame and AR.js.">
  <style>
    @keyframes spinA { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes spinB { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
    @keyframes sunPulse { 0%, 100% { opacity: 0.20; } 50% { opacity: 0.42; } }
    .orb1 { animation: spinA 6.4s linear infinite; }
    .orb2 { animation: spinA 11s linear infinite; }
    .orb3 { animation: spinB 16s linear infinite; }
    .halo { animation: sunPulse 4.8s cubic-bezier(0.32, 0.72, 0, 1) infinite; }
    @media (prefers-reduced-motion: reduce) { .orb1, .orb2, .orb3, .halo { animation: none !important; } }
  </style>
  <defs>
    <filter id="sblur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5.5"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
    </filter>
    <linearGradient id="sl-t" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#394252"/><stop offset="100%" stop-color="#262d3a"/></linearGradient>
    <linearGradient id="sl-l" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#262d3a"/><stop offset="100%" stop-color="#181d26"/></linearGradient>
    <linearGradient id="sl-r" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#181d26"/><stop offset="100%" stop-color="#07090d"/></linearGradient>

    <linearGradient id="ac-t" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f7a889"/><stop offset="100%" stop-color="#d96c43"/></linearGradient>
    <linearGradient id="ac-l" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#d96c43"/><stop offset="100%" stop-color="#8c3b1e"/></linearGradient>
    <linearGradient id="ac-r" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#8c3b1e"/><stop offset="100%" stop-color="#07090d"/></linearGradient>

    <linearGradient id="br-t" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f0cb8d"/><stop offset="100%" stop-color="#c48d44"/></linearGradient>
    <linearGradient id="br-l" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#c48d44"/><stop offset="100%" stop-color="#7c5522"/></linearGradient>
    <linearGradient id="br-r" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7c5522"/><stop offset="100%" stop-color="#07090d"/></linearGradient>

    <radialGradient id="spot-warm" cx="78%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#e57a52" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#e57a52" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spot-brass" cx="76%" cy="50%" r="46%">
      <stop offset="0%" stop-color="#d9a45b" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#d9a45b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <defs>
    <radialGradient id="sunGrad" cx="35%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#f0cb8d"/>
      <stop offset="55%" stop-color="#e57a52"/>
      <stop offset="100%" stop-color="#8c3b1e"/>
    </radialGradient>
  </defs>
  <rect x="0.75" y="0.75" width="496.5" height="294.5" rx="12" fill="#11141a" stroke="#2a313d" stroke-width="1.15"/><rect x="1" y="1" width="496" height="294" rx="12" fill="url(#spot-warm)"/><line x1="16" y1="1.6" x2="482" y2="1.6" stroke="#ffffff" stroke-opacity="0.11" stroke-width="1"/>

  <text x="32" y="72" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="30" font-weight="700" letter-spacing="-0.6" fill="#f3efe6">Solar System AR</text>
  <text x="32" y="100" font-family="'Cascadia Mono', Consolas, ui-monospace, monospace" font-size="12.5" fill="#d9a45b">WebAR · A-Frame · AR.js</text>

  <text x="32" y="142" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="15.5" fill="#b6b1a6">Browser learning tool</text>
  <text x="32" y="166" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="15.5" fill="#b6b1a6">uniting product UI with</text>
  <text x="32" y="190" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="15.5" fill="#b6b1a6">3D augmented reality.</text>

  <g font-family="'Cascadia Mono', Consolas, ui-monospace, monospace" font-size="12" fill="#f3efe6">
    <rect x="32" y="216" width="102" height="26" rx="6" fill="#1d222c" stroke="#2a313d"/>
    <text x="83" y="233" text-anchor="middle">TypeScript</text>
  </g>
  <text x="32" y="268" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" font-weight="700" fill="#e57a52">Inspect repository</text>

  <ellipse cx="376" cy="238" rx="76" ry="17" fill="#07090d" opacity="0.52" filter="url(#sblur)"/>

  <g transform="translate(376,150) rotate(-18) scale(1, 0.44)">
    <circle cx="0" cy="0" r="96" fill="none" stroke="#5b6575" stroke-width="1.5" stroke-dasharray="6 6"/>
    <g class="orb3">
      <circle cx="96" cy="0" r="9.5" fill="#d9a45b"/>
      <circle cx="93" cy="-3" r="3" fill="#f0cb8d"/>
    </g>
  </g>
  <g transform="translate(376,150) rotate(12) scale(1, 0.46)">
    <circle cx="0" cy="0" r="68" fill="none" stroke="#5b6575" stroke-width="1.4"/>
    <g class="orb2">
      <circle cx="-68" cy="0" r="10.5" fill="#e57a52"/>
      <circle cx="-71" cy="-3" r="3.5" fill="#f7a889"/>
    </g>
  </g>

  <circle cx="376" cy="150" r="32" fill="#e57a52" class="halo" filter="url(#sblur)"/>
  <circle cx="376" cy="150" r="22" fill="url(#sunGrad)"/>

  <g transform="translate(376,150) rotate(-8) scale(1, 0.42)">
    <circle cx="0" cy="0" r="44" fill="none" stroke="#e57a52" stroke-width="1.4" opacity="0.85"/>
    <g class="orb1"><circle cx="44" cy="0" r="7.5" fill="#f3efe6"/></g>
  </g>
</svg>
