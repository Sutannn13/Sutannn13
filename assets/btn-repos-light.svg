<svg xmlns="http://www.w3.org/2000/svg" width="260" height="76" viewBox="0 0 260 76" role="img" aria-label="Repositories: 22 public">
  <style>
    @keyframes sweep {
      0%, 74% { transform: translateX(-290px); opacity: 0; }
      84% { opacity: 0.4; }
      94% { opacity: 0.4; }
      100% { transform: translateX(290px); opacity: 0; }
    }
    @keyframes glyphBob { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-2.5px); } }
    .sheen { animation: sweep 7.2s cubic-bezier(0.32, 0.72, 0, 1) 0.80s infinite; }
    .gbob { animation: glyphBob 4.6s cubic-bezier(0.32, 0.72, 0, 1) 0.80s infinite; }
    @media (prefers-reduced-motion: reduce) { .sheen, .gbob { animation: none !important; } }
  </style>
  <defs>
    <filter id="sblur" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="5.5"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
    </filter>
    <linearGradient id="sl-t" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#eee8dd"/><stop offset="100%" stop-color="#dbd3c5"/></linearGradient>
    <linearGradient id="sl-l" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dbd3c5"/><stop offset="100%" stop-color="#c1b8a8"/></linearGradient>
    <linearGradient id="sl-r" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#c1b8a8"/><stop offset="100%" stop-color="#a99f8e"/></linearGradient>

    <linearGradient id="ac-t" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#df6b40"/><stop offset="100%" stop-color="#b5451b"/></linearGradient>
