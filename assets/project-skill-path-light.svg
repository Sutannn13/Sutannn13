<svg xmlns="http://www.w3.org/2000/svg" width="684" height="296" viewBox="0 0 684 296" role="img" aria-label="Skill Path AI: highest-starred repository (3 stars), turning an existing profile into a practical skill roadmap and career direction.">
  <style>
    @keyframes climb {
      0%, 10% { transform: translate(0px, 0px); }
      26%, 32% { transform: translate(34px, -34px); }
      48%, 54% { transform: translate(68px, -70px); }
      70%, 76% { transform: translate(102px, -106px); }
      90%, 100% { transform: translate(136px, -144px); }
    }
    @keyframes towerFloat { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-4px); } }
    .beacon { animation: climb 5.4s cubic-bezier(0.32, 0.72, 0, 1) infinite alternate; }
    .tfloat { animation: towerFloat 6s cubic-bezier(0.32, 0.72, 0, 1) infinite; }
    @media (prefers-reduced-motion: reduce) {
      .beacon { animation: none !important; transform: translate(136px, -144px); }
      .tfloat { animation: none !important; }
    }
  </style>
  <defs>
    <filter id="sblur" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="5.5"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
    </filter>
    <linearGradient id="sl-t" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#eee8dd"/><stop offset="100%" stop-color="#dbd3c5"/></linearGradient>
    <linearGradient id="sl-l" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dbd3c5"/><stop offset="100%" stop-color="#c1b8a8"/></linearGradient>
    <linearGradient id="sl-r" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#c1b8a8"/><stop offset="100%" stop-color="#a99f8e"/></linearGradient>

    <linearGradient id="ac-t" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#df6b40"/><stop offset="100%" stop-color="#b5451b"/></linearGradient>
    <linearGradient id="ac-l" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#b5451b"/><stop offset="100%" stop-color="#78280b"/></linearGradient>
    <linearGradient id="ac-r" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#78280b"/><stop offset="100%" stop-color="#a99f8e"/></linearGradient>

    <linearGradient id="br-t" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ad7d33"/><stop offset="100%" stop-color="#7d5318"/></linearGradient>
    <linearGradient id="br-l" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7d5318"/><stop offset="100%" stop-color="#4f330a"/></linearGradient>
    <linearGradient id="br-r" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#4f330a"/><stop offset="100%" stop-color="#a99f8e"/></linearGradient>

    <radialGradient id="spot-warm" cx="78%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#b5451b" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#b5451b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spot-brass" cx="76%" cy="50%" r="46%">
      <stop offset="0%" stop-color="#7d5318" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#7d5318" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spot-mini" cx="82%" cy="36%" r="36%">
      <stop offset="0%" stop-color="#b5451b" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#b5451b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0.75" y="0.75" width="682.5" height="294.5" rx="12" fill="#f7f4ee" stroke="#d6cfc2" stroke-width="1.15"/><rect x="1" y="1" width="682" height="294" rx="12" fill="url(#spot-brass)"/><line x1="16" y1="1.6" x2="668" y2="1.6" stroke="#ffffff" stroke-opacity="0.88" stroke-width="1"/>

  <!-- Subtle architectural altitude elevation guides behind the 3D tower -->
  <g stroke="#d6cfc2" stroke-width="1" stroke-dasharray="2 6" opacity="0.45">
    <line x1="422" y1="84" x2="644" y2="84"/>
    <line x1="422" y1="138" x2="644" y2="138"/>
    <line x1="422" y1="192" x2="644" y2="192"/>
  </g>

  <text x="36" y="70" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="32" font-weight="700" letter-spacing="-0.7" fill="#161614">Skill Path AI</text>
  <text x="36" y="98" font-family="'Cascadia Mono', Consolas, ui-monospace, monospace" font-size="12.5" fill="#b5451b">3 stars on GitHub · TypeScript</text>

  <text x="36" y="140" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="16" fill="#4a4741">Turns an existing developer profile into</text>
  <text x="36" y="164" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="16" fill="#4a4741">a structured skill roadmap, portfolio guide,</text>
  <text x="36" y="188" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="16" fill="#4a4741">and clear career direction.</text>

  <g font-family="'Cascadia Mono', Consolas, ui-monospace, monospace" font-size="12" fill="#161614">
    <rect x="36" y="212" width="102" height="26" rx="6" fill="#ece6db" stroke="#d6cfc2"/>
    <text x="87" y="229" text-anchor="middle">TypeScript</text>
    <rect x="148" y="212" width="112" height="26" rx="6" fill="#ece6db" stroke="#d6cfc2"/>
    <text x="204" y="229" text-anchor="middle">Career Engine</text>
  </g>
  <text x="36" y="267" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" font-weight="700" fill="#b5451b">Inspect repository</text>
  <circle cx="174.0" cy="262.0" r="11.0" fill="#ece6db" stroke="#d6cfc2" stroke-width="1"/><path d="M171.4,257.8 L176.8,262.0 L171.4,266.2" fill="none" stroke="#b5451b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  <ellipse cx="534" cy="242" rx="108" ry="24" fill="#a99f8e" opacity="0.58" filter="url(#sblur)"/>
  <g class="tfloat"><polygon points="441.0,208.0 464.0,219.0 464.0,243.0 441.0,232.0" fill="url(#sl-l)"/><polygon points="487.0,208.0 464.0,219.0 464.0,243.0 487.0,232.0" fill="url(#sl-r)"/><polygon points="464.0,197.0 487.0,208.0 464.0,219.0 441.0,208.0" fill="url(#sl-t)"/><polyline points="441.0,208.0 464.0,219.0 487.0,208.0" fill="none" stroke="#ffffff" stroke-opacity="0.72" stroke-width="1.15" stroke-linejoin="round"/><line x1="464.0" y1="219.0" x2="464.0" y2="243.0" stroke="#ffffff" stroke-opacity="0.40" stroke-width="0.95"/><polygon points="475.0,174.0 498.0,185.0 498.0,231.0 475.0,220.0" fill="url(#sl-l)"/><polygon points="521.0,174.0 498.0,185.0 498.0,231.0 521.0,220.0" fill="url(#sl-r)"/><polygon points="498.0,163.0 521.0,174.0 498.0,185.0 475.0,174.0" fill="url(#sl-t)"/><polyline points="475.0,174.0 498.0,185.0 521.0,174.0" fill="none" stroke="#ffffff" stroke-opacity="0.72" stroke-width="1.15" stroke-linejoin="round"/><line x1="498.0" y1="185.0" x2="498.0" y2="231.0" stroke="#ffffff" stroke-opacity="0.40" stroke-width="0.95"/><polygon points="509.0,138.0 532.0,149.0 532.0,219.0 509.0,208.0" fill="url(#br-l)"/><polygon points="555.0,138.0 532.0,149.0 532.0,219.0 555.0,208.0" fill="url(#br-r)"/><polygon points="532.0,127.0 555.0,138.0 532.0,149.0 509.0,138.0" fill="url(#br-t)"/><polyline points="509.0,138.0 532.0,149.0 555.0,138.0" fill="none" stroke="#ffffff" stroke-opacity="0.72" stroke-width="1.15" stroke-linejoin="round"/><line x1="532.0" y1="149.0" x2="532.0" y2="219.0" stroke="#ffffff" stroke-opacity="0.40" stroke-width="0.95"/><polygon points="543.0,102.0 566.0,113.0 566.0,207.0 543.0,196.0" fill="url(#sl-l)"/><polygon points="589.0,102.0 566.0,113.0 566.0,207.0 589.0,196.0" fill="url(#sl-r)"/><polygon points="566.0,91.0 589.0,102.0 566.0,113.0 543.0,102.0" fill="url(#sl-t)"/><polyline points="543.0,102.0 566.0,113.0 589.0,102.0" fill="none" stroke="#ffffff" stroke-opacity="0.72" stroke-width="1.15" stroke-linejoin="round"/><line x1="566.0" y1="113.0" x2="566.0" y2="207.0" stroke="#ffffff" stroke-opacity="0.40" stroke-width="0.95"/><polygon points="577.0,64.0 600.0,75.0 600.0,195.0 577.0,184.0" fill="url(#ac-l)"/><polygon points="623.0,64.0 600.0,75.0 600.0,195.0 623.0,184.0" fill="url(#ac-r)"/><polygon points="600.0,53.0 623.0,64.0 600.0,75.0 577.0,64.0" fill="url(#ac-t)"/><polyline points="577.0,64.0 600.0,75.0 623.0,64.0" fill="none" stroke="#ffffff" stroke-opacity="0.72" stroke-width="1.15" stroke-linejoin="round"/><line x1="600.0" y1="75.0" x2="600.0" y2="195.0" stroke="#ffffff" stroke-opacity="0.40" stroke-width="0.95"/></g>
  <g class="beacon"><polygon points="451.0,187.0 464.0,193.2 464.0,206.2 451.0,200.0" fill="url(#ac-l)"/><polygon points="477.0,187.0 464.0,193.2 464.0,206.2 477.0,200.0" fill="url(#ac-r)"/><polygon points="464.0,180.8 477.0,187.0 464.0,193.2 451.0,187.0" fill="url(#ac-t)"/><polyline points="451.0,187.0 464.0,193.2 477.0,187.0" fill="none" stroke="#ffffff" stroke-opacity="0.72" stroke-width="1.15" stroke-linejoin="round"/></g>
</svg>
