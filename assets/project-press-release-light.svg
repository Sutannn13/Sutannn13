<svg xmlns="http://www.w3.org/2000/svg" width="380" height="236" viewBox="0 0 380 236" role="img" aria-label="Press Release Generator: TypeScript tool converting structured 5W+1H field notes into consistent press release drafts.">
  <style>
    @keyframes sheetA { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-7px); } }
    @keyframes sheetB { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-12px); } }
    .sa { animation: sheetA 4.6s cubic-bezier(0.32, 0.72, 0, 1) infinite; }
    .sb { animation: sheetB 4.6s cubic-bezier(0.32, 0.72, 0, 1) 0.35s infinite; }
    @media (prefers-reduced-motion: reduce) { .sa, .sb { animation: none !important; } }
  </style>
  <defs>
    <filter id="sblur" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="5.5"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
    </filter>
    <linearGradient id="sl-t" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#eee8dd"/><stop offset="100%" stop-color="#dbd3c5"/></linearGradient>
    <linearGradient id="sl-l" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dbd3c5"/><stop offset="100%" stop-color="#c1b8a8"/></linearGradient>
    <linearGradient id="sl-r" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#c1b8a8"/><stop offset="100%" stop-color="#a99f8e"/></linearGradient>

    <linearGradient id="ac-t" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#df6b40"/><stop offset="100%" stop-color="#b5451b"/></linearGradient>
    <linearGradient id="ac-l" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#b5451b"/><stop offset="100%" stop-color="#78280b"/></linearGradient>
    <linearGradient id="ac-r" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#78280b"/><stop offset="100%" stop-color="#a99f8e"/></linearGradient>

    <linearGradient id="br-t" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ad7d33"/><stop offset="100%" stop-color="#7d5318"/></linearGradient>
    <linearGradient id="br-l" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7d5318"/><stop offset="100%" stop-color="#4f330a"/></linearGradient>
    <linearGradient id="br-r" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#4f330a"/><stop offset="100%" stop-color="#a99f8e"/></linearGradient>

    <radialGradient id="spot-warm" cx="78%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#b5451b" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#b5451b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spot-brass" cx="76%" cy="50%" r="46%">
      <stop offset="0%" stop-color="#7d5318" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#7d5318" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spot-mini" cx="82%" cy="36%" r="36%">
      <stop offset="0%" stop-color="#b5451b" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#b5451b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0.75" y="0.75" width="378.5" height="234.5" rx="12" fill="#f7f4ee" stroke="#d6cfc2" stroke-width="1.15"/><rect x="1" y="1" width="378" height="234" rx="12" fill="url(#spot-mini)"/><line x1="16" y1="1.6" x2="364" y2="1.6" stroke="#ffffff" stroke-opacity="0.88" stroke-width="1"/>
  <text x="26" y="52" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="700" letter-spacing="-0.4" fill="#161614">Press Release</text>
  <text x="26" y="78" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="700" letter-spacing="-0.4" fill="#161614">Generator</text>
  <text x="26" y="114" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="14.5" fill="#4a4741">Turns structured 5W+1H field notes</text>
  <text x="26" y="136" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="14.5" fill="#4a4741">into consistent press release drafts.</text>
  <rect x="26" y="160" width="96" height="24" rx="6" fill="#ece6db" stroke="#d6cfc2"/>
  <text x="74" y="176" text-anchor="middle" font-family="'Cascadia Mono', Consolas, ui-monospace, monospace" font-size="11.5" fill="#161614">TypeScript</text>
  <text x="26" y="212" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#b5451b">Inspect repository</text>
  <circle cx="158.0" cy="207.0" r="10.0" fill="#ece6db" stroke="#d6cfc2" stroke-width="1"/><path d="M155.4,202.8 L160.8,207.0 L155.4,211.2" fill="none" stroke="#b5451b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  <ellipse cx="310" cy="122" rx="38" ry="11" fill="#a99f8e" opacity="0.54" filter="url(#sblur)"/>
  <polygon points="276.0,101.0 310.0,116.0 310.0,123.0 276.0,108.0" fill="url(#sl-l)"/><polygon points="344.0,101.0 310.0,116.0 310.0,123.0 344.0,108.0" fill="url(#sl-r)"/><polygon points="310.0,86.0 344.0,101.0 310.0,116.0 276.0,101.0" fill="url(#sl-t)"/><polyline points="276.0,101.0 310.0,116.0 344.0,101.0" fill="none" stroke="#ffffff" stroke-opacity="0.72" stroke-width="1.15" stroke-linejoin="round"/><g class="sa"><polygon points="276.0,81.0 310.0,96.0 310.0,103.0 276.0,88.0" fill="url(#br-l)"/><polygon points="344.0,81.0 310.0,96.0 310.0,103.0 344.0,88.0" fill="url(#br-r)"/><polygon points="310.0,66.0 344.0,81.0 310.0,96.0 276.0,81.0" fill="url(#br-t)"/><polyline points="276.0,81.0 310.0,96.0 344.0,81.0" fill="none" stroke="#ffffff" stroke-opacity="0.72" stroke-width="1.15" stroke-linejoin="round"/></g><g class="sb"><polygon points="276.0,61.0 310.0,76.0 310.0,83.0 276.0,68.0" fill="url(#ac-l)"/><polygon points="344.0,61.0 310.0,76.0 310.0,83.0 344.0,68.0" fill="url(#ac-r)"/><polygon points="310.0,46.0 344.0,61.0 310.0,76.0 276.0,61.0" fill="url(#ac-t)"/><polyline points="276.0,61.0 310.0,76.0 344.0,61.0" fill="none" stroke="#ffffff" stroke-opacity="0.72" stroke-width="1.15" stroke-linejoin="round"/><line x1="296" y1="60" x2="318" y2="51" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.3" stroke-linecap="round"/><line x1="303" y1="65" x2="325" y2="56" stroke="#ffffff" stroke-opacity="0.40" stroke-width="1.2" stroke-linecap="round"/></g>
</svg>
