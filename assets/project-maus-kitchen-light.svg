<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="284" viewBox="0 0 1200 284" role="img" aria-label="Flagship live product: Mau's Kitchen. Menu discovery, ordering, and daily operations for an active kitchen at maukitchen.my.id.">
  <style>
    @keyframes liftA { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-6px); } }
    @keyframes liftB { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
    @keyframes orderFlow1 {
      0% { transform: translate(0px, 0px); opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { transform: translate(126px, -20px); opacity: 0; }
    }
    @keyframes orderFlow2 {
      0% { transform: translate(0px, 0px); opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { transform: translate(122px, 32px); opacity: 0; }
    }
    @keyframes railDash { from { stroke-dashoffset: 36; } to { stroke-dashoffset: 0; } }
    .la { animation: liftA 4.8s cubic-bezier(0.32, 0.72, 0, 1) infinite; }
    .lb { animation: liftB 4.8s cubic-bezier(0.32, 0.72, 0, 1) 0.55s infinite; }
    .lc { animation: liftA 4.8s cubic-bezier(0.32, 0.72, 0, 1) 1.1s infinite; }
    .of1 { animation: orderFlow1 3.0s cubic-bezier(0.32, 0.72, 0, 1) infinite; }
    .of2 { animation: orderFlow2 3.0s cubic-bezier(0.32, 0.72, 0, 1) 1.5s infinite; }
    .rail { stroke-dasharray: 5 7; animation: railDash 2.2s linear infinite; }
    @media (prefers-reduced-motion: reduce) {
      .la, .lb, .lc, .of1, .of2, .rail { animation: none !important; }
    }
  </style>
  <defs>
    <filter id="sblur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5.5"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
    </filter>
    <linearGradient id="sl-t" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ede7dc"/><stop offset="100%" stop-color="#dbd3c5"/></linearGradient>
    <linearGradient id="sl-l" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dbd3c5"/><stop offset="100%" stop-color="#c2b9a9"/></linearGradient>
    <linearGradient id="sl-r" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#c2b9a9"/><stop offset="100%" stop-color="#a99f8e"/></linearGradient>

    <linearGradient id="ac-t" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#df6b40"/><stop offset="100%" stop-color="#b5451b"/></linearGradient>
    <linearGradient id="ac-l" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#b5451b"/><stop offset="100%" stop-color="#78280b"/></linearGradient>
    <linearGradient id="ac-r" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#78280b"/><stop offset="100%" stop-color="#a99f8e"/></linearGradient>

    <linearGradient id="br-t" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ad7d33"/><stop offset="100%" stop-color="#7d5318"/></linearGradient>
    <linearGradient id="br-l" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7d5318"/><stop offset="100%" stop-color="#4f330a"/></linearGradient>
    <linearGradient id="br-r" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#4f330a"/><stop offset="100%" stop-color="#a99f8e"/></linearGradient>

    <radialGradient id="spot-warm" cx="78%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#b5451b" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#b5451b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spot-brass" cx="76%" cy="50%" r="46%">
      <stop offset="0%" stop-color="#7d5318" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#7d5318" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0.75" y="0.75" width="1198.5" height="282.5" rx="16" fill="#ebe5da" stroke="#d2cabd" stroke-width="1.4"/><rect x="6" y="6" width="1188" height="272" rx="10" fill="#f9f3eb" stroke="#d6cfc2" stroke-width="1"/><rect x="6" y="6" width="1188" height="272" rx="10" fill="url(#spot-warm)"/><rect x="6" y="6" width="1188" height="272" rx="10" filter="url(#grain)" opacity="0.022"/><line x1="18" y1="7" x2="1182" y2="7" stroke="#ffffff" stroke-opacity="0.85" stroke-width="1"/>

  <!-- Single functional live status marker (verified HTTP 200) -->
  <rect x="46" y="38" width="144" height="26" rx="6" fill="#e3f0e8" stroke="#1e6b43" stroke-width="1"/>
  <text x="118" y="55" text-anchor="middle" font-family="'Cascadia Mono', Consolas, ui-monospace, monospace" font-size="11.5" font-weight="700" fill="#1e6b43">LIVE PRODUCTION</text>
  <text x="206" y="55" font-family="'Cascadia Mono', Consolas, ui-monospace, monospace" font-size="13" fill="#5c5850">maukitchen.my.id</text>

  <text x="46" y="110" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="38" font-weight="700" letter-spacing="-0.8" fill="#161614">Mau's Kitchen</text>
  <rect x="46" y="126" width="46" height="3" fill="#b5451b"/>

  <text x="46" y="162" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="16.5" fill="#4a4741">Customer menu discovery, structured ordering, and daily kitchen</text>
  <text x="46" y="186" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="16.5" fill="#4a4741">admin operations running in production for an active food business.</text>

  <g font-family="'Cascadia Mono', Consolas, ui-monospace, monospace" font-size="12.5" fill="#161614">
    <rect x="46" y="214" width="102" height="28" rx="6" fill="#ece6db" stroke="#d6cfc2"/>
    <text x="97" y="233" text-anchor="middle">TypeScript</text>
    <rect x="158" y="214" width="132" height="28" rx="6" fill="#ece6db" stroke="#d6cfc2"/>
    <text x="224" y="233" text-anchor="middle">Operations UI</text>
    <rect x="300" y="214" width="116" height="28" rx="6" fill="#ece6db" stroke="#d6cfc2"/>
    <text x="358" y="233" text-anchor="middle">Order Flow</text>
  </g>

  <line x1="712" y1="36" x2="712" y2="248" stroke="#d6cfc2" stroke-width="1" stroke-dasharray="3 5"/>

  <ellipse cx="836" cy="204" rx="60" ry="17" fill="#a99f8e" opacity="0.56" filter="url(#sblur)"/>
  <ellipse cx="962" cy="192" rx="66" ry="19" fill="#a99f8e" opacity="0.60" filter="url(#sblur)"/>
  <ellipse cx="1084" cy="216" rx="60" ry="17" fill="#a99f8e" opacity="0.56" filter="url(#sblur)"/>

  <line x1="836" y1="164" x2="962" y2="144" stroke="#b5451b" stroke-width="1.8" class="rail"/>
  <line x1="962" y1="144" x2="1084" y2="176" stroke="#7d5318" stroke-width="1.8" class="rail"/>

  <g class="la"><polygon points="780.0,162.0 836.0,187.0 836.0,201.0 780.0,176.0" fill="url(#sl-l)"/><polygon points="892.0,162.0 836.0,187.0 836.0,201.0 892.0,176.0" fill="url(#sl-r)"/><polygon points="836.0,137.0 892.0,162.0 836.0,187.0 780.0,162.0" fill="url(#sl-t)"/><polyline points="780.0,162.0 836.0,187.0 892.0,162.0" fill="none" stroke="#ffffff" stroke-opacity="0.68" stroke-width="1.15" stroke-linejoin="round"/></g>
  <g class="lb"><polygon points="902.0,140.0 962.0,167.0 962.0,183.0 902.0,156.0" fill="url(#ac-l)"/><polygon points="1022.0,140.0 962.0,167.0 962.0,183.0 1022.0,156.0" fill="url(#ac-r)"/><polygon points="962.0,113.0 1022.0,140.0 962.0,167.0 902.0,140.0" fill="url(#ac-t)"/><polyline points="902.0,140.0 962.0,167.0 1022.0,140.0" fill="none" stroke="#ffffff" stroke-opacity="0.68" stroke-width="1.15" stroke-linejoin="round"/></g>
  <g class="lc"><polygon points="1028.0,174.0 1084.0,199.0 1084.0,213.0 1028.0,188.0" fill="url(#br-l)"/><polygon points="1140.0,174.0 1084.0,199.0 1084.0,213.0 1140.0,188.0" fill="url(#br-r)"/><polygon points="1084.0,149.0 1140.0,174.0 1084.0,199.0 1028.0,174.0" fill="url(#br-t)"/><polyline points="1028.0,174.0 1084.0,199.0 1140.0,174.0" fill="none" stroke="#ffffff" stroke-opacity="0.68" stroke-width="1.15" stroke-linejoin="round"/></g>

  <g class="of1"><polygon points="822.0,135.0 836.0,141.5 836.0,152.5 822.0,146.0" fill="url(#br-l)"/><polygon points="850.0,135.0 836.0,141.5 836.0,152.5 850.0,146.0" fill="url(#br-r)"/><polygon points="836.0,128.5 850.0,135.0 836.0,141.5 822.0,135.0" fill="url(#br-t)"/><polyline points="822.0,135.0 836.0,141.5 850.0,135.0" fill="none" stroke="#ffffff" stroke-opacity="0.68" stroke-width="1.15" stroke-linejoin="round"/></g>
  <g class="of2"><polygon points="948.0,115.0 962.0,121.5 962.0,132.5 948.0,126.0" fill="url(#ac-l)"/><polygon points="976.0,115.0 962.0,121.5 962.0,132.5 976.0,126.0" fill="url(#ac-r)"/><polygon points="962.0,108.5 976.0,115.0 962.0,121.5 948.0,115.0" fill="url(#ac-t)"/><polyline points="948.0,115.0 962.0,121.5 976.0,115.0" fill="none" stroke="#ffffff" stroke-opacity="0.68" stroke-width="1.15" stroke-linejoin="round"/></g>

  <g text-anchor="middle" font-family="'Cascadia Mono', Consolas, ui-monospace, monospace" font-size="12.5" font-weight="600" fill="#4a4741">
    <text x="836" y="246">MENU</text>
    <text x="962" y="246">QUEUE</text>
    <text x="1084" y="246">SERVED</text>
  </g>
</svg>
