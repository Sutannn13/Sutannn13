<svg xmlns="http://www.w3.org/2000/svg" width="380" height="232" viewBox="0 0 380 232" role="img" aria-label="HMTI Margonda: TypeScript public organization website for the Informatics Student Association at UBSI Margonda.">
  <style>
    @keyframes hubFloat { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-7px); } }
    @keyframes linkPulse { from { stroke-dashoffset: 24; } to { stroke-dashoffset: 0; } }
    .hf { animation: hubFloat 4.6s cubic-bezier(0.32, 0.72, 0, 1) infinite; }
    .lp { stroke-dasharray: 4 5; animation: linkPulse 2s linear infinite; }
    @media (prefers-reduced-motion: reduce) { .hf, .lp { animation: none !important; } }
  </style>
  <defs>
    <filter id="sblur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5.5"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
    </filter>
    <linearGradient id="sl-t" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#394252"/><stop offset="100%" stop-color="#262d3a"/></linearGradient>
    <linearGradient id="sl-l" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#262d3a"/><stop offset="100%" stop-color="#181d26"/></linearGradient>
    <linearGradient id="sl-r" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#181d26"/><stop offset="100%" stop-color="#07090d"/></linearGradient>

    <linearGradient id="ac-t" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f7a889"/><stop offset="100%" stop-color="#d96c43"/></linearGradient>
    <linearGradient id="ac-l" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#d96c43"/><stop offset="100%" stop-color="#8c3b1e"/></linearGradient>
    <linearGradient id="ac-r" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#8c3b1e"/><stop offset="100%" stop-color="#07090d"/></linearGradient>

    <linearGradient id="br-t" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f0cb8d"/><stop offset="100%" stop-color="#c48d44"/></linearGradient>
    <linearGradient id="br-l" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#c48d44"/><stop offset="100%" stop-color="#7c5522"/></linearGradient>
    <linearGradient id="br-r" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7c5522"/><stop offset="100%" stop-color="#07090d"/></linearGradient>

    <radialGradient id="spot-warm" cx="78%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#e57a52" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#e57a52" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spot-brass" cx="76%" cy="50%" r="46%">
      <stop offset="0%" stop-color="#d9a45b" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#d9a45b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0.75" y="0.75" width="378.5" height="230.5" rx="12" fill="#151920" stroke="#2a313d" stroke-width="1.15"/><line x1="16" y1="1.6" x2="364" y2="1.6" stroke="#ffffff" stroke-opacity="0.11" stroke-width="1"/>
  <text x="26" y="54" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="700" letter-spacing="-0.4" fill="#f3efe6">HMTI</text>
  <text x="26" y="80" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="700" letter-spacing="-0.4" fill="#f3efe6">Margonda</text>
  <text x="26" y="118" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="14.5" fill="#b6b1a6">Public website for the Informatics</text>
  <text x="26" y="140" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="14.5" fill="#b6b1a6">Student Association, UBSI Margonda.</text>
  <rect x="26" y="164" width="96" height="24" rx="6" fill="#1d222c" stroke="#2a313d"/>
  <text x="74" y="180" text-anchor="middle" font-family="'Cascadia Mono', Consolas, ui-monospace, monospace" font-size="11.5" fill="#f3efe6">TypeScript</text>
  <text x="26" y="210" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#e57a52">Inspect repository</text>

  <ellipse cx="310" cy="122" rx="50" ry="12" fill="#07090d" opacity="0.48" filter="url(#sblur)"/>
  <line x1="270" y1="102" x2="310" y2="86" stroke="#e57a52" stroke-width="1.6" class="lp"/>
  <line x1="348" y1="102" x2="310" y2="86" stroke="#d9a45b" stroke-width="1.6" class="lp"/>
  <polygon points="256.0,94.0 270.0,100.5 270.0,114.5 256.0,108.0" fill="url(#sl-l)"/><polygon points="284.0,94.0 270.0,100.5 270.0,114.5 284.0,108.0" fill="url(#sl-r)"/><polygon points="270.0,87.5 284.0,94.0 270.0,100.5 256.0,94.0" fill="url(#sl-t)"/><polyline points="256.0,94.0 270.0,100.5 284.0,94.0" fill="none" stroke="#fff4e6" stroke-opacity="0.26" stroke-width="1.15" stroke-linejoin="round"/><polygon points="334.0,94.0 348.0,100.5 348.0,114.5 334.0,108.0" fill="url(#br-l)"/><polygon points="362.0,94.0 348.0,100.5 348.0,114.5 362.0,108.0" fill="url(#br-r)"/><polygon points="348.0,87.5 362.0,94.0 348.0,100.5 334.0,94.0" fill="url(#br-t)"/><polyline points="334.0,94.0 348.0,100.5 362.0,94.0" fill="none" stroke="#fff4e6" stroke-opacity="0.26" stroke-width="1.15" stroke-linejoin="round"/><g class="hf"><polygon points="288.0,66.0 310.0,76.0 310.0,102.0 288.0,92.0" fill="url(#ac-l)"/><polygon points="332.0,66.0 310.0,76.0 310.0,102.0 332.0,92.0" fill="url(#ac-r)"/><polygon points="310.0,56.0 332.0,66.0 310.0,76.0 288.0,66.0" fill="url(#ac-t)"/><polyline points="288.0,66.0 310.0,76.0 332.0,66.0" fill="none" stroke="#fff4e6" stroke-opacity="0.26" stroke-width="1.15" stroke-linejoin="round"/></g>
</svg>
