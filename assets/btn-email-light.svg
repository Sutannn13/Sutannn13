<svg xmlns="http://www.w3.org/2000/svg" width="260" height="76" viewBox="0 0 260 76" role="img" aria-label="Email: Direct">
  <style>
    @keyframes sweep {
      0%, 74% { transform: translateX(-290px); opacity: 0; }
      84% { opacity: 0.4; }
      94% { opacity: 0.4; }
      100% { transform: translateX(290px); opacity: 0; }
    }
    @keyframes glyphBob {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-2.5px); }
    }
    .sheen { animation: sweep 7.2s cubic-bezier(0.32, 0.72, 0, 1) 2.40s infinite; }
    .gbob { animation: glyphBob 4.6s cubic-bezier(0.32, 0.72, 0, 1) 2.40s infinite; }
    @media (prefers-reduced-motion: reduce) { .sheen, .gbob { animation: none !important; } }
  </style>
  <defs>
    <filter id="sblur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5.5"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
    </filter>
    <linearGradient id="sl-t" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ede7dc"/><stop offset="100%" stop-color="#dbd3c5"/></linearGradient>
    <linearGradient id="sl-l" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dbd3c5"/><stop offset="100%" stop-color="#c2b9a9"/></linearGradient>
    <linearGradient id="sl-r" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#c2b9a9"/><stop offset="100%" stop-color="#a99f8e"/></linearGradient>

    <linearGradient id="ac-t" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#df6b40"/><stop offset="100%" stop-color="#b5451b"/></linearGradient>
    <linearGradient id="ac-l" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#b5451b"/><stop offset="100%" stop-color="#78280b"/></linearGradient>
    <linearGradient id="ac-r" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#78280b"/><stop offset="100%" stop-color="#a99f8e"/></linearGradient>

    <linearGradient id="br-t" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ad7d33"/><stop offset="100%" stop-color="#7d5318"/></linearGradient>
    <linearGradient id="br-l" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7d5318"/><stop offset="100%" stop-color="#4f330a"/></linearGradient>
    <linearGradient id="br-r" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#4f330a"/><stop offset="100%" stop-color="#a99f8e"/></linearGradient>

    <radialGradient id="spot-warm" cx="78%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#b5451b" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#b5451b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spot-brass" cx="76%" cy="50%" r="46%">
      <stop offset="0%" stop-color="#7d5318" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#7d5318" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <defs>
    <clipPath id="tc"><rect x="1" y="1" width="258" height="74" rx="12"/></clipPath>
    <linearGradient id="sg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b5451b" stop-opacity="0"/>
      <stop offset="50%" stop-color="#b5451b" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#b5451b" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0.75" y="0.75" width="258.5" height="74.5" rx="12" fill="#f7f4ee" stroke="#d6cfc2" stroke-width="1.15"/><line x1="16" y1="1.6" x2="244" y2="1.6" stroke="#ffffff" stroke-opacity="0.85" stroke-width="1"/>
  <g clip-path="url(#tc)"><rect x="0" y="0" width="96" height="76" fill="url(#sg)" class="sheen"/></g>
  <g class="gbob"><polygon points="23.5,39.0 37.0,45.2 37.0,56.2 23.5,50.0" fill="url(#br-l)"/><polygon points="50.5,39.0 37.0,45.2 37.0,56.2 50.5,50.0" fill="url(#br-r)"/><polygon points="37.0,32.8 50.5,39.0 37.0,45.2 23.5,39.0" fill="url(#br-t)"/><polyline points="23.5,39.0 37.0,45.2 50.5,39.0" fill="none" stroke="#ffffff" stroke-opacity="0.68" stroke-width="1.15" stroke-linejoin="round"/></g>
  <text x="68" y="36" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="17" font-weight="700" letter-spacing="-0.2" fill="#161614">Email</text>
  <text x="68" y="56" font-family="'Cascadia Mono', Consolas, ui-monospace, monospace" font-size="12" fill="#5c5850">Direct</text>
  <!-- Button-in-Button trailing architectural indicator island -->
  <circle cx="228" cy="38" r="14" fill="#ece6db" stroke="#d6cfc2" stroke-width="1"/>
  <path d="M225,33 L231,38 L225,43" fill="none" stroke="#b5451b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
