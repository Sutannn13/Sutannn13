name: Refresh profile data

on:
  push:
    branches:
      - main
    paths:
      - scripts/update_profile.py
      - .github/workflows/profile-data.yml
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-data
  cancel-in-progress: true

jobs:
  refresh:
    name: Refresh GitHub and WakaTime snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Build profile data
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: python3 scripts/update_profile.py

      - name: Commit changed data only
        shell: bash
        run: |
          if git diff --quiet -- README.md assets/live-stats.svg; then
            echo "Profile data is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/live-stats.svg
          git commit -m "chore(profile): refresh public activity data"
          git push
