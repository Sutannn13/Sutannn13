<svg xmlns="http://www.w3.org/2000/svg" width="380" height="236" viewBox="0 0 380 236" role="img" aria-label="HMTI Margonda: TypeScript public organization website for the Informatics Student Association at UBSI Margonda.">
  <style>
    @keyframes hubFloat { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-7px); } }
    @keyframes linkPulse { from { stroke-dashoffset: 24; } to { stroke-dashoffset: 0; } }
    .hf { animation: hubFloat 4.6s cubic-bezier(0.32, 0.72, 0, 1) infinite; }
    .lp { stroke-dasharray: 4 5; animation: linkPulse 2s linear infinite; }
    @media (prefers-reduced-motion: reduce) { .hf, .lp { animation: none !important; } }
  </style>
  <defs>
    <filter id="sblur" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="5.5"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
    </filter>
    <linearGradient id="sl-t" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#3b4556"/><stop offset="100%" stop-color="#262d3a"/></linearGradient>
    <linearGradient id="sl-l" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#262d3a"/><stop offset="100%" stop-color="#171c25"/></linearGradient>
    <linearGradient id="sl-r" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#171c25"/><stop offset="100%" stop-color="#06080c"/></linearGradient>

    <linearGradient id="ac-t" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f7a889"/><stop offset="100%" stop-color="#d96c43"/></linearGradient>
    <linearGradient id="ac-l" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#d96c43"/><stop offset="100%" stop-color="#8c3b1e"/></linearGradient>
    <linearGradient id="ac-r" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#8c3b1e"/><stop offset="100%" stop-color="#06080c"/></linearGradient>

    <linearGradient id="br-t" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f0cb8d"/><stop offset="100%" stop-color="#c48d44"/></linearGradient>
    <linearGradient id="br-l" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#c48d44"/><stop offset="100%" stop-color="#7c5522"/></linearGradient>
    <linearGradient id="br-r" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7c5522"/><stop offset="100%" stop-color="#06080c"/></linearGradient>

    <radialGradient id="spot-warm" cx="78%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#e57a52" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#e57a52" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spot-brass" cx="76%" cy="50%" r="46%">
      <stop offset="0%" stop-color="#d9a45b" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#d9a45b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spot-mini" cx="82%" cy="36%" r="36%">
      <stop offset="0%" stop-color="#e57a52" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#e57a52" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0.75" y="0.75" width="378.5" height="234.5" rx="12" fill="#151920" stroke="#2b323f" stroke-width="1.15"/><rect x="1" y="1" width="378" height="234" rx="12" fill="url(#spot-mini)"/><line x1="16" y1="1.6" x2="364" y2="1.6" stroke="#ffffff" stroke-opacity="0.13" stroke-width="1"/>
  <text x="26" y="52" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="700" letter-spacing="-0.4" fill="#f3efe6">HMTI</text>
  <text x="26" y="78" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="700" letter-spacing="-0.4" fill="#f3efe6">Margonda</text>
  <text x="26" y="114" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="14.5" fill="#b6b1a6">Public website for the Informatics</text>
  <text x="26" y="136" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="14.5" fill="#b6b1a6">Student Association, UBSI Margonda.</text>
  <rect x="26" y="160" width="96" height="24" rx="6" fill="#1e232d" stroke="#2b323f"/>
  <text x="74" y="176" text-anchor="middle" font-family="'Cascadia Mono', Consolas, ui-monospace, monospace" font-size="11.5" fill="#f3efe6">TypeScript</text>
  <text x="26" y="212" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#e57a52">Inspect repository</text>
  <circle cx="158.0" cy="207.0" r="10.0" fill="#1e232d" stroke="#2b323f" stroke-width="1"/><path d="M155.4,202.8 L160.8,207.0 L155.4,211.2" fill="none" stroke="#e57a52" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  <ellipse cx="310" cy="126" rx="52" ry="13" fill="#06080c" opacity="0.50" filter="url(#sblur)"/>
  <line x1="270" y1="102" x2="310" y2="86" stroke="#e57a52" stroke-width="1.6" class="lp"/>
  <line x1="348" y1="102" x2="310" y2="86" stroke="#d9a45b" stroke-width="1.6" class="lp"/>
  <polygon points="256.0,94.0 270.0,100.5 270.0,114.5 256.0,108.0" fill="url(#sl-l)"/><polygon points="284.0,94.0 270.0,100.5 270.0,114.5 284.0,108.0" fill="url(#sl-r)"/><polygon points="270.0,87.5 284.0,94.0 270.0,100.5 256.0,94.0" fill="url(#sl-t)"/><polyline points="256.0,94.0 270.0,100.5 284.0,94.0" fill="none" stroke="#fff4e6" stroke-opacity="0.28" stroke-width="1.15" stroke-linejoin="round"/><line x1="270.0" y1="100.5" x2="270.0" y2="114.5" stroke="#fff4e6" stroke-opacity="0.15" stroke-width="0.95"/><polygon points="334.0,94.0 348.0,100.5 348.0,114.5 334.0,108.0" fill="url(#br-l)"/><polygon points="362.0,94.0 348.0,100.5 348.0,114.5 362.0,108.0" fill="url(#br-r)"/><polygon points="348.0,87.5 362.0,94.0 348.0,100.5 334.0,94.0" fill="url(#br-t)"/><polyline points="334.0,94.0 348.0,100.5 362.0,94.0" fill="none" stroke="#fff4e6" stroke-opacity="0.28" stroke-width="1.15" stroke-linejoin="round"/><line x1="348.0" y1="100.5" x2="348.0" y2="114.5" stroke="#fff4e6" stroke-opacity="0.15" stroke-width="0.95"/><g class="hf"><polygon points="288.0,66.0 310.0,76.0 310.0,102.0 288.0,92.0" fill="url(#ac-l)"/><polygon points="332.0,66.0 310.0,76.0 310.0,102.0 332.0,92.0" fill="url(#ac-r)"/><polygon points="310.0,56.0 332.0,66.0 310.0,76.0 288.0,66.0" fill="url(#ac-t)"/><polyline points="288.0,66.0 310.0,76.0 332.0,66.0" fill="none" stroke="#fff4e6" stroke-opacity="0.28" stroke-width="1.15" stroke-linejoin="round"/><line x1="310.0" y1="76.0" x2="310.0" y2="102.0" stroke="#fff4e6" stroke-opacity="0.15" stroke-width="0.95"/></g><polygon points="298.0,114.0 310.0,119.5 310.0,129.5 298.0,124.0" fill="url(#sl-l)"/><polygon points="322.0,114.0 310.0,119.5 310.0,129.5 322.0,124.0" fill="url(#sl-r)"/><polygon points="310.0,108.5 322.0,114.0 310.0,119.5 298.0,114.0" fill="url(#sl-t)"/><polyline points="298.0,114.0 310.0,119.5 322.0,114.0" fill="none" stroke="#fff4e6" stroke-opacity="0.28" stroke-width="1.15" stroke-linejoin="round"/>
</svg>
