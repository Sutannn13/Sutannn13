<svg xmlns="http://www.w3.org/2000/svg" width="684" height="296" viewBox="0 0 684 296" role="img" aria-label="Skill Path AI: highest-starred repository (3 stars), turning an existing profile into a practical skill roadmap and career direction.">
  <style>
    @keyframes climb {
      0%, 10% { transform: translate(0px, 0px); }
      26%, 32% { transform: translate(34px, -34px); }
      48%, 54% { transform: translate(68px, -70px); }
      70%, 76% { transform: translate(102px, -106px); }
      90%, 100% { transform: translate(136px, -144px); }
    }
    @keyframes towerFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    .beacon { animation: climb 5.4s cubic-bezier(0.32, 0.72, 0, 1) infinite alternate; }
    .tfloat { animation: towerFloat 6s cubic-bezier(0.32, 0.72, 0, 1) infinite; }
    @media (prefers-reduced-motion: reduce) {
      .beacon { animation: none !important; transform: translate(136px, -144px); }
      .tfloat { animation: none !important; }
    }
  </style>
  <defs>
    <filter id="sblur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5.5"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
    </filter>
    <linearGradient id="sl-t" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#394252"/><stop offset="100%" stop-color="#262d3a"/></linearGradient>
    <linearGradient id="sl-l" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#262d3a"/><stop offset="100%" stop-color="#181d26"/></linearGradient>
    <linearGradient id="sl-r" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#181d26"/><stop offset="100%" stop-color="#07090d"/></linearGradient>

    <linearGradient id="ac-t" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f7a889"/><stop offset="100%" stop-color="#d96c43"/></linearGradient>
    <linearGradient id="ac-l" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#d96c43"/><stop offset="100%" stop-color="#8c3b1e"/></linearGradient>
    <linearGradient id="ac-r" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#8c3b1e"/><stop offset="100%" stop-color="#07090d"/></linearGradient>

    <linearGradient id="br-t" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f0cb8d"/><stop offset="100%" stop-color="#c48d44"/></linearGradient>
    <linearGradient id="br-l" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#c48d44"/><stop offset="100%" stop-color="#7c5522"/></linearGradient>
    <linearGradient id="br-r" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7c5522"/><stop offset="100%" stop-color="#07090d"/></linearGradient>

    <radialGradient id="spot-warm" cx="78%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#e57a52" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#e57a52" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spot-brass" cx="76%" cy="50%" r="46%">
      <stop offset="0%" stop-color="#d9a45b" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#d9a45b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0.75" y="0.75" width="682.5" height="294.5" rx="12" fill="#151920" stroke="#2a313d" stroke-width="1.15"/><rect x="1" y="1" width="682" height="294" rx="12" fill="url(#spot-brass)"/><line x1="16" y1="1.6" x2="668" y2="1.6" stroke="#ffffff" stroke-opacity="0.11" stroke-width="1"/>

  <text x="36" y="72" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="32" font-weight="700" letter-spacing="-0.7" fill="#f3efe6">Skill Path AI</text>
  <text x="36" y="100" font-family="'Cascadia Mono', Consolas, ui-monospace, monospace" font-size="12.5" fill="#e57a52">3 stars on GitHub · TypeScript</text>

  <text x="36" y="142" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="16" fill="#b6b1a6">Turns an existing developer profile into</text>
  <text x="36" y="166" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="16" fill="#b6b1a6">a structured skill roadmap, portfolio guide,</text>
  <text x="36" y="190" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="16" fill="#b6b1a6">and clear career direction.</text>

  <g font-family="'Cascadia Mono', Consolas, ui-monospace, monospace" font-size="12" fill="#f3efe6">
    <rect x="36" y="216" width="102" height="26" rx="6" fill="#1d222c" stroke="#2a313d"/>
    <text x="87" y="233" text-anchor="middle">TypeScript</text>
    <rect x="148" y="216" width="112" height="26" rx="6" fill="#1d222c" stroke="#2a313d"/>
    <text x="204" y="233" text-anchor="middle">Career Engine</text>
  </g>
  <text x="36" y="268" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" font-weight="700" fill="#e57a52">Inspect repository</text>

  <ellipse cx="536" cy="242" rx="108" ry="24" fill="#07090d" opacity="0.58" filter="url(#sblur)"/>
  <g class="tfloat"><polygon points="443.0,208.0 466.0,219.0 466.0,243.0 443.0,232.0" fill="url(#sl-l)"/><polygon points="489.0,208.0 466.0,219.0 466.0,243.0 489.0,232.0" fill="url(#sl-r)"/><polygon points="466.0,197.0 489.0,208.0 466.0,219.0 443.0,208.0" fill="url(#sl-t)"/><polyline points="443.0,208.0 466.0,219.0 489.0,208.0" fill="none" stroke="#fff4e6" stroke-opacity="0.26" stroke-width="1.15" stroke-linejoin="round"/><polygon points="477.0,174.0 500.0,185.0 500.0,231.0 477.0,220.0" fill="url(#sl-l)"/><polygon points="523.0,174.0 500.0,185.0 500.0,231.0 523.0,220.0" fill="url(#sl-r)"/><polygon points="500.0,163.0 523.0,174.0 500.0,185.0 477.0,174.0" fill="url(#sl-t)"/><polyline points="477.0,174.0 500.0,185.0 523.0,174.0" fill="none" stroke="#fff4e6" stroke-opacity="0.26" stroke-width="1.15" stroke-linejoin="round"/><polygon points="511.0,138.0 534.0,149.0 534.0,219.0 511.0,208.0" fill="url(#br-l)"/><polygon points="557.0,138.0 534.0,149.0 534.0,219.0 557.0,208.0" fill="url(#br-r)"/><polygon points="534.0,127.0 557.0,138.0 534.0,149.0 511.0,138.0" fill="url(#br-t)"/><polyline points="511.0,138.0 534.0,149.0 557.0,138.0" fill="none" stroke="#fff4e6" stroke-opacity="0.26" stroke-width="1.15" stroke-linejoin="round"/><polygon points="545.0,102.0 568.0,113.0 568.0,207.0 545.0,196.0" fill="url(#sl-l)"/><polygon points="591.0,102.0 568.0,113.0 568.0,207.0 591.0,196.0" fill="url(#sl-r)"/><polygon points="568.0,91.0 591.0,102.0 568.0,113.0 545.0,102.0" fill="url(#sl-t)"/><polyline points="545.0,102.0 568.0,113.0 591.0,102.0" fill="none" stroke="#fff4e6" stroke-opacity="0.26" stroke-width="1.15" stroke-linejoin="round"/><polygon points="579.0,64.0 602.0,75.0 602.0,195.0 579.0,184.0" fill="url(#ac-l)"/><polygon points="625.0,64.0 602.0,75.0 602.0,195.0 625.0,184.0" fill="url(#ac-r)"/><polygon points="602.0,53.0 625.0,64.0 602.0,75.0 579.0,64.0" fill="url(#ac-t)"/><polyline points="579.0,64.0 602.0,75.0 625.0,64.0" fill="none" stroke="#fff4e6" stroke-opacity="0.26" stroke-width="1.15" stroke-linejoin="round"/></g>
  <g class="beacon"><polygon points="453.0,187.0 466.0,193.2 466.0,206.2 453.0,200.0" fill="url(#ac-l)"/><polygon points="479.0,187.0 466.0,193.2 466.0,206.2 479.0,200.0" fill="url(#ac-r)"/><polygon points="466.0,180.8 479.0,187.0 466.0,193.2 453.0,187.0" fill="url(#ac-t)"/><polyline points="453.0,187.0 466.0,193.2 479.0,187.0" fill="none" stroke="#fff4e6" stroke-opacity="0.26" stroke-width="1.15" stroke-linejoin="round"/></g>
</svg>
